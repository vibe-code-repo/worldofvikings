<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World of Vikings – Game</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="render-canvas"></canvas>
    <div class="marker" data-testid="game-marker">World of Vikings &ndash; game dev build</div>
    <!-- Top right: how fast the loop runs on this machine. -->
    <div class="stats" data-testid="game-fps">&hellip; fps</div>
    <!-- One stack, bottom left: each line is its own row, so a longer status
         never lands on top of the line below it. -->
    <div class="hud">
      <div class="controls" data-testid="game-controls">
        WASD move &middot; Shift sprint &middot; Space dodge &middot; E interact &middot; LMB attack
        &middot; RMB block &middot; 1&ndash;5 slots &middot; click the scene to capture the mouse
      </div>
      <div class="status" data-testid="game-status">starting…</div>
      <div class="status" data-testid="game-world">world: loading…</div>
      <div class="status" data-testid="game-assets">assets: loading…</div>
      <div class="status" data-testid="game-asset-sources">assets: source unknown</div>
      <div class="status" data-testid="game-collision">collision: loading&hellip;</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
