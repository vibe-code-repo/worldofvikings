# World of Vikings — Proxy-Eintrag fuer play.dev.world-of-vikings.com
#
# KOPIE, keine Quelle. Die wirksame Datei liegt im Nginx Proxy Manager
# (CT 100, /opt/npm/data/nginx/proxy_host/4.conf) und wird von dessen
# Oberflaeche aus einer Datenbank ERZEUGT. Wer den Host dort speichert,
# ueberschreibt sie samt aller Sonderbloecke.
#
# Genau deshalb steht sie hier: Nach so einem Speichern ist der Zustand
# aus der Datei allein nicht mehr zu rekonstruieren, und was fehlt, faellt
# nicht auf — es geht nichts kaputt, es steht nur etwas offen.
#
# Vier Sonderbloecke, die NPM nicht von sich aus schreibt:
#   /accounts/          ohne Basic-Auth, sonst scheitert die Anmeldung von
#                       world-of-vikings.com aus an CORS (der 401 traegt
#                       keine CORS-Kopfzeilen)
#   /assets/models/     ohne Basic-Auth, fuer die Figurenvorschau
#   /api/               MIT Basic-Auth  — der Betriebsdienst auf 2468
#   = /editor.html      MIT Basic-Auth  — derselbe Vite liefert ihn aus
#
# Seit dem 27.08.2026 ist "location /" OHNE Basic-Auth: Das Testgestade
# soll sich ohne Passwort spielen lassen. Die beiden MIT-Bloecke sind die
# Gegenrechnung dazu, ausfuehrlich begruendet an Ort und Stelle.
#
# Wiederherstellen:
#   pct push 100 <diese Datei> /opt/npm/data/nginx/proxy_host/4.conf
#   pct exec 100 -- docker exec npm nginx -t
#   pct exec 100 -- docker exec npm nginx -s reload
#
# ---------------------------------------------------------------------

# ------------------------------------------------------------
# play.dev.world-of-vikings.com
# ------------------------------------------------------------



map $scheme $hsts_header {
    https   "max-age=63072000; preload";
}

server {
  set $forward_scheme http;
  set $server         "10.10.10.12";
  set $port           5274;

  listen 80;
#listen [::]:80;

listen 443 ssl;
#listen [::]:443;


  server_name play.dev.world-of-vikings.com;

  http2 on;


  # Let's Encrypt SSL
  include conf.d/include/letsencrypt-acme-challenge.conf;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/npm-4/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/npm-4/privkey.pem;






  # Block Exploits
  include conf.d/include/block-exploits.conf;







    # Force SSL
    
    set $trust_forwarded_proto "F";
    
    include conf.d/include/force-ssl.conf;




proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $http_connection;
proxy_http_version 1.1;


  access_log /data/logs/proxy-host-4_access.log proxy;
  error_log /data/logs/proxy-host-4_error.log warn;







  # ---------------------------------------------------------------
  # Figurenmodelle ohne Zugangssperre.
  #
  # Die Charaktererstellung liegt auf world-of-vikings.com und laedt die
  # Teile vom GEWAEHLTEN Gestade — live und dev tragen nicht zwingend
  # denselben Stand, eine Vorschau immer von live waere also falsch.
  # Eine Anfrage ueber die Domaingrenze schickt aber keine Basic-Auth
  # mit: Sie bekaeme 401, und der Browser meldet nur "Status 0".
  #
  # Freigegeben ist ausschliesslich /assets/models/ — Editor, Admin und
  # alles andere bleiben hinter der Sperre. Dieselben Dateien liegen auf
  # live ohnehin oeffentlich.
  #
  # ACHTUNG: NPM erzeugt diese Datei aus seiner Datenbank neu, sobald
  # jemand den Host in der Oberflaeche speichert. Dann ist dieser Block
  # weg und die Vorschau gegen das Testgestade bleibt leer.
  # Sicherung liegt als 4.conf.vor-modelle daneben.
  # Konto-API des Spielservers (server/src/konto/KontoApi.ts).
  #
  # OHNE Basic-Auth, und das muss so sein: Die Anmeldeseite auf
  # world-of-vikings.com ruft diese Adresse per fetch aus einem fremden
  # Ursprung auf. Mit auth_basic antwortet nginx mit 401 BEVOR der
  # Spielserver drankommt -- und dieser 401 traegt keine CORS-Kopfzeilen.
  # Der Browser bricht die Anfrage dann ab, ohne den Status je zu sehen:
  # "blocked by CORS policy", und die Seite meldet nur "Gestade nicht
  # erreichbar".
  #
  # Was damit offen steht: Fremde koennen auf dem TESTGESTADE Konten
  # anlegen. Spielen koennen sie damit nicht -- der Client selbst bleibt
  # hinter der Basic-Auth. Der Schutz dieser Endpunkte sitzt im Dienst
  # (Passwortpruefung, Versuchssperre je Herkunft, signierte Token), nicht
  # in einer Adresssperre.
  #
  # ACHTUNG: NPM erzeugt diese Datei aus seiner Datenbank neu, sobald
  # jemand den Host in der Oberflaeche speichert. Dann ist dieser Block
  # weg und die Anmeldung gegen das Testgestade bricht.
  # Sicherung liegt als 4.conf.vor-konten daneben.
  location /accounts/ {
    auth_basic off;
    proxy_http_version 1.1;

    # Eigene CORS-Angaben, weil die aus custom/server_proxy.conf fuer
    # Modelldateien gemacht sind: GET, HEAD, OPTIONS und Range,
    # Content-Type. Diese API braucht POST und DELETE und schickt ihr
    # Token in X-WoV-Account.
    #
    # ALLE VIER hier wiederholen: headers-more erbt auf dieser Ebene
    # nichts mehr, sobald hier ueberhaupt ein more_set_headers steht.
    # Ohne die Origin-Zeile faellt sie ersatzlos weg und der Browser
    # verwirft die Antwort.
    #
    # Und more_set_headers statt add_header, weil dieselbe Regel wie
    # nebenan gilt: proxy.conf bringt ein add_header mit, das jedes
    # add_header dieser Ebene verdraengen wuerde. Es ueberschreibt
    # ausserdem, was der Spielserver selbst setzt -- deshalb muss es hier
    # richtig stehen und nicht nur dort.
    more_set_headers "Access-Control-Allow-Origin: $wov_cors";
    more_set_headers "Vary: Origin";
    more_set_headers "Access-Control-Allow-Methods: GET, POST, DELETE, OPTIONS";
    more_set_headers "Access-Control-Allow-Headers: Content-Type, X-WoV-Account";

    include conf.d/include/proxy.conf;
  }

  location /assets/models/ {
    auth_basic off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    include conf.d/include/proxy.conf;
  }

  # ---------------------------------------------------------------
  # Editor und Betriebsdienst bleiben ZU, auch auf diesem Host.
  #
  # Seit dem 27.08.2026 ist das Spiel auf play.dev ohne Passwort
  # erreichbar (siehe "location /" weiter unten). Damit waere ohne diesen
  # Block auch /api/ offen — und das ist der Betriebsdienst auf 2468:
  # Weltdokument schreiben, Serverlog mitlesen, Dienste anfassen.
  #
  # Der Herkunfts-Riegel des Dienstes faengt das NICHT ab. Vite setzt
  # X-Forwarded-For auf die Adresse seines Anrufers, und das ist hinter
  # diesem Proxy der NPM-Container selbst (10.10.10.x) — also "lokal",
  # egal wer wirklich fragt. Den Token setzt Vite serverseitig dazu. Die
  # Basic-Auth hier ist damit die einzige Schranke vor der dev-Welt; das
  # steht ausfuehrlich in admin/src/main.ts (Kopfkommentar "Was das auf
  # live NICHT leistet").
  #
  # /editor.html mit: derselbe Vite liefert ihn auch unter play.dev aus,
  # und ein Editor, der ueber den einen Namen zu und ueber den anderen
  # offen ist, ist nicht zu.
  #
  # Fuers Spielen kostet das nichts. Der einzige /api/-Aufruf ausserhalb
  # des Editors ist das Speichern einer gezeichneten Route im Testflug
  # (client/src/main.ts) — dort fragt der Browser dann einmal nach dem
  # Passwort.
  #
  # ACHTUNG: NPM erzeugt diese Datei aus seiner Datenbank neu, sobald
  # jemand den Host in der Oberflaeche speichert. Dann ist dieser Block
  # weg — und anders als bei den Bloecken darueber faellt das nicht auf,
  # weil dann nichts kaputt geht, sondern etwas offen steht.
  # Sicherung liegt als 4.conf.vor-offen daneben.
  location /api/ {
    auth_basic            "Authorization required";
    auth_basic_user_file  /data/access/1;
    proxy_set_header Authorization "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    include conf.d/include/proxy.conf;
  }

  location = /editor.html {
    auth_basic            "Authorization required";
    auth_basic_user_file  /data/access/1;
    proxy_set_header Authorization "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    include conf.d/include/proxy.conf;
  }

  location / {

    # KEINE Basic-Auth mehr: Das Testgestade soll sich ohne Passwort
    # spielen lassen (Mike, 27.08.2026). Der Spielserver dahinter hat
    # seine eigene Anmeldung — Konto, Charakter, Ticket —, und Konten
    # liessen sich hier ohnehin schon anlegen (siehe location /accounts/).
    # Was NICHT mit aufgeht, steht in den beiden Bloecken darueber.
    #
    # `proxy_set_header Authorization ""` bleibt trotzdem stehen: Der
    # Client schickt seinen Sitzungsnachweis in X-WoV-Account, nicht in
    # Authorization, und diese Zeile ist die Begruendung dafuer
    # (KontoApi.ts). Sie jetzt zu entfernen hiesse, diesen Umweg still
    # ueberfluessig zu machen und beim naechsten Umbau neu zu entdecken.
    proxy_set_header Authorization "";


    

    

    # Access checks must...
    
    satisfy any;
    








    
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    

    # Proxy!
    include conf.d/include/proxy.conf;
  }


  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}

