# World of Vikings — EIN Ursprung im Container wov-lab.
#
# Ziel: /etc/nginx/sites-available/wov-lab (Symlink in sites-enabled),
# ausgerollt von deploy/install-services.sh. Ersetzt fuer DIESEN Container
# das Nebeneinander aus Vite-Dev-Server (5274, direkt erreichbar) und
# Betriebsdienst (2468, direkt erreichbar): Aussen ist ab jetzt GENAU EIN
# Port (80) sichtbar, und der Nginx Proxy Manager auf dem Host zeigt nur
# noch dorthin (Mikes Entscheidung 2, 12.09.2026).
#
# ── Was hier zusammenkommt und warum an GENAU dieser Stelle ───────────
#   /            die vorgerenderte Webseite (wov-web, adapter-static)
#   /play/       der Spiel-Client — heute der Vite-Dev-Server (5274),
#                spaeter wahlweise die gebauten Buendel (siehe unten)
#   /editor/     dieselbe Anwendung, nur der Editor-Einstieg
#   /api/accounts/  Konten-API des SPIELSERVERS (server/src/konto/KontoApi.ts)
#   /api/        Betriebsdienst (admin/src/main.ts, Weltdokument/Konsole)
#   /assets/     Modelle, Texturen, Audio — statisch, inkl. der zur
#                Laufzeit erzeugten Ordner (store-lab, generiert)
#   /ws          Spielserver-WebSocket
#
# Die Reihenfolge der location-Bloecke unten spiegelt diese Liste NICHT
# zwingend die Prioritaet wider: nginx waehlt bei praefix-Direktiven immer
# den LAENGSTEN passenden Praefix, ganz gleich wo er in der Datei steht.
# /api/accounts/ gewinnt deshalb zuverlaessig gegen /api/, auch wenn beide
# Bloecke die Reihenfolge tauschten.
#
# ── Warum /api/accounts/ und nicht einfach /accounts/ ──────────────────
# Der Spielserver selbst kennt nur `/accounts/...` (KontoApi.ts prueft
# `pfad.startsWith('/accounts')`) — hierher wird deshalb mit `rewrite`
# der `/api`-Anteil VOR dem proxy_pass abgeschnitten. Der Betriebsdienst
# dagegen erwartet seine Pfade MIT `/api`-Anteil (admin/src/main.ts prueft
# woertlich `pfad === '/api/worldlayout'` usw.) — /api/ wird deshalb OHNE
# rewrite durchgereicht, genau wie es der Vite-Dev-Proxy (client/vite.config.ts,
# server.proxy['/api/']) schon immer getan hat. Ein einziges `/api/`, das
# beide Dienste bedienen sollte, waere ein Praefix mit zwei Bedeutungen.
#
# ── /play/ und /editor/ ─────────────────────────────────────────────
# Der Client baut jetzt mit `base: '/play/'` (client/vite.config.ts):
# JEDER erzeugte Verweis — Bundle-Skripte, CSS, auch der HTML-Eintrag von
# editor.html — traegt das Praefix schon selbst. `/editor/` muss deshalb
# nur die EINE HTML-Anfrage auf `/play/editor.html` umschreiben; alle
# weiteren Anfragen dieser Seite (Skripte, `/assets/…`) tragen ihr Ziel
# bereits absolut im eigenen Verweis und laufen ueber die anderen
# location-Bloecke. Ein zweiter Satz Bloecke unter /editor/ waere eine
# zweite, mitzupflegende Kopie derselben Regeln.
#
# ── Vite-Dev vs. gebaute Buendel ─────────────────────────────────────
# Diese Fassung zeigt /play/ auf den laufenden Vite-Dev-Server (5274) —
# richtig fuer ein Labor, das aus den Quellen faehrt (tools/wov-update.sh
# startet auf dieser Instanz KEINEN Client-Build, siehe dort). Sobald
# stattdessen gebaute Buendel ausgeliefert werden sollen, ersetzt der
# auskommentierte Block weiter unten den Proxy durch ein statisches
# `alias` auf `client/dist/` — die Bundle-URLs bleiben identisch, weil
# beide Wege von derselben `base: '/play/'` ausgehen.
#
# ── Voraussetzungen auf dem Container ─────────────────────────────────
# Wie bei nginx-live.conf: der Admin-Token gehoert NICHT ins Repo.
#
#   /etc/nginx/wov-admin-token.conf   (0600, root:root)
#       proxy_set_header x-wov-token "<Inhalt von /etc/wov-admin.token>";
#
# Kompression bewusst NICHT hier: Dieser Container ist ein Labor, keine
# Auslieferung an Besucher — deploy/nginx-live.conf begruendet Brotli/Gzip
# ausfuehrlich, hier waere es nur eine zweite Stelle, die man synchron
# halten muesste, ohne dass sie hier etwas nutzt.

server {
    listen 80 default_server;
    server_name _;

    # ── Webseite (wov-web, adapter-static) ───────────────────────────
    # trailingSlash bleibt 'never' im Adapter (svelte.config.js) — daher
    # `saga.html` statt `saga/index.html`; `try_files $uri $uri.html $uri/`
    # bedient sowohl `/saga` als auch `/saga.html`. `/de/` ist bewusst
    # KEIN Alias fuer `/de` (wov-webseite-de-ohne-schraegstrich.md) —
    # dieser Block erzeugt keinen, `try_files` liefert dafuer ehrlich 404.
    root /opt/worldofvikings/wov-web/build;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Dieselbe Umleitung wie bei /editor — "/play" ohne Schraegstrich
    # matcht das Praefix "/play/" unten nicht und faellt sonst auf /.
    location = /play {
        return 301 /play/;
    }

    # ── Spiel-Client (Vite-Dev, base: '/play/') ──────────────────────
    location /play/ {
        proxy_pass http://127.0.0.1:5274;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Vites eigenes HMR laeuft als WebSocket-Upgrade auf DEMSELBEN
        # Pfad-Praefix — ohne diese beiden Zeilen bliebe die Dev-Konsole
        # bei "connecting..." haengen, auch wenn die Seite laedt.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Spaeter: gebaute Buendel statt Vite-Dev ──────────────────────
    # location /play/ {
    #     alias /opt/worldofvikings/client/dist/;
    #     try_files $uri $uri/ =404;
    # }

    # Ohne Schraegstrich auf MIT umleiten — sonst faellt "/editor" (kein
    # Server-Verzeichnis, das nginx selbst umleiten koennte) durch auf
    # location / und liefert dort ein ehrliches, aber falsches 404.
    location = /editor {
        return 301 /editor/;
    }

    # ── Editor-Einstieg ───────────────────────────────────────────────
    # Nur die HTML-Anfrage wird umgeschrieben; alles Weitere (Skripte,
    # /assets/…) adressiert sich ueber `base: '/play/'` bereits selbst.
    location = /editor/ {
        rewrite ^ /play/editor.html break;
        proxy_pass http://127.0.0.1:5274;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Konten-API des Spielservers ───────────────────────────────────
    # /api/accounts/xyz -> /accounts/xyz auf dem Spielserver (2467).
    # KEIN /api-Anteil auf der Zielseite — siehe Begruendung oben im Kopf.
    location /api/accounts/ {
        rewrite ^/api/accounts/(.*)$ /accounts/$1 break;
        proxy_pass http://127.0.0.1:2467;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Die Versuchssperre der Konten-API zaehlt je Herkunft (wie in
        # nginx-live.conf begruendet) — ohne diese beiden Zeilen saehe
        # der Dienst nur 127.0.0.1 und sperrte nach fuenf Fehlgriffen ALLE.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Konten-API, bare (ohne /api-Anteil), fuer den Spiel-Client selbst
    # ────────────────────────────────────────────────────────────────
    # Der eingebaute Anmeldedialog des Clients (client/src/ui/Anmeldung.ts,
    # Bauer "Anmeldung") ruft `fetch('/accounts/...')` auf — bewusst OHNE
    # das `/api`-Praefix, weil er den Ursprung mit der Webseite teilt und
    # der Spielserver selbst nur `/accounts/...` versteht. Im Vite-Dev-
    # Betrieb bedient client/vite.config.ts (server.proxy['/accounts/'])
    # diesen Pfad zusaetzlich zu diesem Block; unter nginx (dieser Datei)
    # WAERE er ohne dieses `location`ohne Ziel gewesen und auf `location /`
    # (die statische Webseite) mit 404 gelandet — ein reiner Textzugriff
    # anstelle des Kontos. KEIN rewrite noetig: die Zielseite versteht den
    # Pfad bereits woertlich.
    location /accounts/ {
        proxy_pass http://127.0.0.1:2467;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Betriebsdienst ────────────────────────────────────────────────
    # OHNE rewrite: admin/src/main.ts erwartet den /api-Anteil woertlich
    # (`pfad === '/api/worldlayout'` usw.) — genau wie der Vite-Dev-Proxy
    # (client/vite.config.ts) ihn schon immer unveraendert durchreicht.
    location /api/ {
        include /etc/nginx/wov-admin-token.conf;

        proxy_pass http://127.0.0.1:2468;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # UEBERSCHREIBEN, nicht anhaengen: admin/src/main.ts liest den
        # ERSTEN Eintrag als Herkunft. Ein $proxy_add_x_forwarded_for
        # liesse jeden Aufrufer sich selbst eine erlaubte Adresse
        # voranstellen (dieselbe Begruendung wie in nginx-live.conf).
        proxy_set_header X-Forwarded-For $remote_addr;

        client_max_body_size 32m;

        # Server-Sent-Events (/api/serverlog) — ohne diese vier Zeilen
        # kommt kein einziges Ereignis an, weil nginx sonst puffert, bis
        # der Strom endet, was er nie tut.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Spielserver-WebSocket ─────────────────────────────────────────
    # Der Client bildet die Adresse selbst als wss://<host>/ws
    # (client/src/main.ts) — UNABHAENGIG von /play/, weil location.host
    # keinen Pfad traegt. Das Vite-Plugin gameWsProxy (client/vite.config.ts)
    # macht im Dev-Betrieb dasselbe; hier uebernimmt nginx es zusaetzlich
    # auf Ebene des einen Ursprungs, sodass ein spaeterer Wechsel auf
    # gebaute Buendel (ohne Vite-Prozess) nichts an dieser Regel aendert.
    location /ws {
        proxy_pass http://127.0.0.1:2467;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Spiel-Assets ──────────────────────────────────────────────────
    # Derselbe Ordner, den `assetHandler` im Vite-Dev-Server ausliefert
    # (client/vite.config.ts) — inklusive der zur Laufzeit erzeugten
    # Unterordner (`assets/generiert/`, s. dort). `alias`, nicht `root`:
    # der URL-Praefix `/assets/` selbst gehoert nicht zum Dateipfad.
    location /assets/ {
        alias /opt/worldofvikings/assets/;
        try_files $uri =404;
    }
}
