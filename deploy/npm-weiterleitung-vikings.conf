# World of Vikings — Vorlage: world-of-vikings.com wird abgeloest (Karte D1)
#
# NOCH NICHT AUSGEFUEHRT. Diese Datei ist eine VORLAGE fuer Teil 3 der
# Karte D1, kein wirksamer Proxy-Host. Sie beschreibt, was der Orchestrator
# in den Nginx Proxy Manager (CT 100) eintraegt, WENN Mike den Umzug
# freigibt — nach den neuen Hosts und Zertifikaten (Teil 3, Reihenfolge
# unten), nicht davor.
#
# Regel (ZIELAENDERUNG, Karte D1):
#   /de/…    -> https://world-of-mmorpg.de/de/…
#   /en/…    -> https://world-of-mmorpg.com/en/…
#   alles andere -> https://world-of-mmorpg.com/…
#   Pfad UND Query bleiben erhalten.
# Dieselbe Regel steht als Funktion in
# wov-web/src/lib/basisDomains.ts (weiterleitungsZielVikings, mit Test in
# basisDomains.test.ts) — nginx kann diese Funktion nicht aufrufen, muss
# aber dieselbe Vorschrift abbilden. Die zwei `rewrite`-Zeilen unten und
# diese Funktion daher immer zusammen aendern.
#
# ---------------------------------------------------------------------
# 1) world-of-vikings.com und www.world-of-vikings.com (Apex + www)
#    Ersetzt den heutigen Proxy-Host (siehe Karte D1, Teil 1, Fundstelle
#    „CT 103" — Ziel http://10.10.10.12:80) durch reine Weiterleitung.
#    Custom-Nginx-Konfiguration des NPM-Proxy-Hosts, "Forward Hostname"
#    kann auf irgendetwas zeigen (return laeuft, bevor proxy_pass greift).
# ---------------------------------------------------------------------
#
# server_name world-of-vikings.com www.world-of-vikings.com;
#
# location /de/ {
#     return 301 https://world-of-mmorpg.de$request_uri;
# }
# location = /de {
#     return 301 https://world-of-mmorpg.de$request_uri;
# }
# location /en/ {
#     return 301 https://world-of-mmorpg.com$request_uri;
# }
# location = /en {
#     return 301 https://world-of-mmorpg.com$request_uri;
# }
# location / {
#     return 301 https://world-of-mmorpg.com$request_uri;
# }
#
# ---------------------------------------------------------------------
# 2) Produktive Subdomains: play./editor./api./assets./live.
#    Je EIGENER NPM-Proxy-Host (eigenes Zertifikat), reine
#    Host-Weiterleitung auf die gleichnamige Subdomain von
#    world-of-mmorpg.com — Pfad und Query bleiben unveraendert, "innerhalb
#    einer Domain bleiben" gilt erst NACH der Anmeldung auf der neuen
#    Domain, nicht fuer den alten Namen selbst.
#
#    Je Subdomain <name> (play, editor, api, assets, live):
# ---------------------------------------------------------------------
#
# server_name <name>.world-of-vikings.com;
#
# location / {
#     return 301 https://<name>.world-of-mmorpg.com$request_uri;
# }
#
# ---------------------------------------------------------------------
# 3) NICHT umgestellt: *.dev.world-of-vikings.com, *.staging.world-of-vikings.com
#    Bleiben laut ZIELAENDERUNG vorerst ohne Weiterleitung in Betrieb — die
#    neuen Namen kommen nur ZUSAETZLICH dazu, nichts an den dev/staging-
#    Namen aendert sich in Teil 3.
# ---------------------------------------------------------------------
