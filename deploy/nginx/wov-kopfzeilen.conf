# World of Vikings — Sicherheits-Kopfzeilen fuer EINEN Ursprung (wov-lab.conf).
#
# Warum eine eigene Datei und nicht vier Zeilen im `server`-Block:
# `add_header` wird in nginx NICHT vererbt, sobald die naechstinnere Ebene
# selbst ein `add_header` setzt — wer den Kopf nur `server`-weit setzt und in
# `location /` ein `Cache-Control` ergaenzt, verliert dort still alle
# Sicherheitskoepfe. Deshalb wird diese Datei an JEDER Stelle eingebunden,
# die ein eigenes `add_header` traegt (aktuell `location /` und
# `/_app/immutable/`) — dieselbe Falle, die Roadmap H7 auf der alten Seite
# schon einmal beschrieben hat. include, not duplicate.
#
# `always` ist Absicht: ohne den Schalter gilt `add_header` nur fuer
# 2xx/3xx/204/304, nicht fuer 404/500 — gerade die Fehlerseiten sollen die
# Koepfe aber tragen.
#
# HSTS bewusst 180 Tage, ohne includeSubDomains und ohne preload: HSTS ist
# praktisch nicht zurueckzunehmen, und Vorbereitung/Unterdomains gehoeren
# nicht in diese erste Stufe. Am Ursprung gesetzt ist zulaessig, weil der
# Client den Kopf ueber HTTPS erhaelt (TLS endet im Proxy Manager, der
# Kopfzeilen des Ursprungs unveraendert durchreicht).
add_header Strict-Transport-Security "max-age=15552000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
