# Proxy-Ausnahme fuer die Konto-API — Nginx Proxy Manager, CT 100
#
# Diese Datei ist DOKUMENTATION, keine eingebundene Konfiguration. Der Block
# unten steht in /data/nginx/proxy_host/4.conf im NPM-Container
# (play.dev.world-of-vikings.com), zusammen mit dem bereits vorhandenen
# location /assets/models/.
#
# WARUM ER NOETIG IST: Ohne auth_basic off antwortet nginx auf jede Anfrage
# an /accounts/ mit 401, BEVOR der Spielserver drankommt -- und dieser 401
# traegt keine CORS-Kopfzeilen. Der Browser bricht dann ab, ohne den Status
# je zu sehen ("blocked by CORS policy"), und die Anmeldeseite meldet nur
# "Gestade nicht erreichbar". Am 24.08.2026 nachgemessen: genau so.
#
# Die eigenen more_set_headers sind der zweite Teil. custom/server_proxy.conf
# setzt CORS fuer MODELLDATEIEN (GET, HEAD, OPTIONS; Range, Content-Type) und
# ueberschreibt damit auch, was der Spielserver selbst setzt. Diese API
# braucht POST und DELETE und ihr Token in X-WoV-Account. Alle vier Zeilen
# muessen hier wiederholt werden: headers-more erbt auf dieser Ebene nichts
# mehr, sobald hier ueberhaupt ein more_set_headers steht -- ohne die
# Origin-Zeile faellt sie ersatzlos weg.
#
# GEFAHR: NPM erzeugt 4.conf aus seiner Datenbank neu, sobald jemand den Host
# in der Oberflaeche speichert. Dann ist dieser Block weg und die Anmeldung
# gegen das Testgestade bricht. Sicherung liegt im Container als
# 4.conf.vor-konten daneben.
#
# Auf LIVE ist das nicht noetig: play.world-of-vikings.com hat keine
# Basic-Auth. Dort genuegt das location /konten/ ... location /accounts/ aus
# deploy/nginx-live.conf.
#
# ── Der Block, wie er im Container steht ────────────────────────────────
  location /accounts/ {
    auth_basic off;
    proxy_http_version 1.1;

    # Eigene CORS-Angaben, weil die aus custom/server_proxy.conf fuer
    # Modelldateien gemacht sind: GET, HEAD, OPTIONS und Range,
    # Content-Type. Diese API braucht POST und DELETE und schickt ihr
    # Token in X-WoV-Account.
    #
    # ALLE VIER hier wiederholen: headers-more erbt auf dieser Ebene
    # nichts mehr, sobald hier ueberhaupt ein more_set_headers steht.
    # Ohne die Origin-Zeile faellt sie ersatzlos weg und der Browser
    # verwirft die Antwort.
    #
    # Und more_set_headers statt add_header, weil dieselbe Regel wie
    # nebenan gilt: proxy.conf bringt ein add_header mit, das jedes
    # add_header dieser Ebene verdraengen wuerde. Es ueberschreibt
    # ausserdem, was der Spielserver selbst setzt -- deshalb muss es hier
    # richtig stehen und nicht nur dort.
    more_set_headers "Access-Control-Allow-Origin: $wov_cors";
    more_set_headers "Vary: Origin";
    more_set_headers "Access-Control-Allow-Methods: GET, POST, DELETE, OPTIONS";
    more_set_headers "Access-Control-Allow-Headers: Content-Type, X-WoV-Account";

    include conf.d/include/proxy.conf;
  }
