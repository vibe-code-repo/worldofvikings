# World of Vikings — EIN Ursprung im Container wov-lab.
#
# Ziel: /etc/nginx/sites-available/wov-lab (Symlink in sites-enabled),
# ausgerollt von deploy/install-services.sh. Ersetzt fuer DIESEN Container
# das Nebeneinander aus Vite-Dev-Server (5274, direkt erreichbar) und
# Betriebsdienst (2468, direkt erreichbar): Aussen ist ab jetzt GENAU EIN
# Port (80) sichtbar, und der Nginx Proxy Manager auf dem Host zeigt nur
# noch dorthin (Mikes Entscheidung 2, 12.09.2026).
#
# ── Was hier zusammenkommt und warum an GENAU dieser Stelle ───────────
#   /            die Webseite (wov-web) — vorgerenderte Seiten UND die
#                bei der Anfrage gerenderten Forum-Seiten aus dem
#                Node-Dienst wov-web.service (127.0.0.1:3000)
#   /play/       der Spiel-Client — heute der Vite-Dev-Server (5274),
#                spaeter wahlweise die gebauten Buendel (siehe unten)
#   /editor/     dieselbe Anwendung, nur der Editor-Einstieg
#   /api/*.json  statische Daten DER WEBSEITE (wov-web/static/api/*.json,
#                z. B. welt.json) — kein Aufruf des Betriebsdiensts
#   /api/accounts/  Konten-API des SPIELSERVERS (server/src/konto/KontoApi.ts)
#   /api/        Betriebsdienst (admin/src/main.ts, Weltdokument/Konsole)
#   /assets/     zuerst die statischen Assets DER WEBSEITE (wov-web/static/
#                assets/, Schriften/Bilder/Karten), sonst die Spiel-Assets:
#                Modelle, Texturen, Audio, inkl. der zur Laufzeit erzeugten
#                Ordner (store-lab, generiert)
#   /ws          Spielserver-WebSocket
#
# Die Reihenfolge der location-Bloecke unten spiegelt diese Liste NICHT
# zwingend die Prioritaet wider: nginx waehlt bei praefix-Direktiven immer
# den LAENGSTEN passenden Praefix, ganz gleich wo er in der Datei steht.
# /api/accounts/ gewinnt deshalb zuverlaessig gegen /api/, auch wenn beide
# Bloecke die Reihenfolge tauschten. Die REGEX-location fuer /api/*.json
# gewinnt wiederum gegen JEDE Praefix-location (auch /api/accounts/ und
# /api/), unabhaengig von ihrer Stelle in der Datei — nginx prueft Regex-
# locations grundsaetzlich NACH der laengsten Praefix-location, aber ein
# Treffer dort gewinnt immer. Sie steht trotzdem VOR den beiden /api/-
# Bloecken, damit die Datei auch ohne dieses Wissen richtig zu lesen ist.
#
# ── Warum /api/accounts/ und nicht einfach /accounts/ ──────────────────
# Der Spielserver selbst kennt nur `/accounts/...` (KontoApi.ts prueft
# `pfad.startsWith('/accounts')`) — hierher wird deshalb mit `rewrite`
# der `/api`-Anteil VOR dem proxy_pass abgeschnitten. Der Betriebsdienst
# dagegen erwartet seine Pfade MIT `/api`-Anteil (admin/src/main.ts prueft
# woertlich `pfad === '/api/worldlayout'` usw.) — /api/ wird deshalb OHNE
# rewrite durchgereicht, genau wie es der Vite-Dev-Proxy (client/vite.config.ts,
# server.proxy['/api/']) schon immer getan hat. Ein einziges `/api/`, das
# beide Dienste bedienen sollte, waere ein Praefix mit zwei Bedeutungen.
#
# ── /play/ und /editor/ ─────────────────────────────────────────────
# Der Client baut jetzt mit `base: '/play/'` (client/vite.config.ts):
# JEDER erzeugte Verweis — Bundle-Skripte, CSS, auch der HTML-Eintrag von
# editor.html — traegt das Praefix schon selbst. `/editor/` muss deshalb
# nur die EINE HTML-Anfrage auf `/play/editor.html` umschreiben; alle
# weiteren Anfragen dieser Seite (Skripte, `/assets/…`) tragen ihr Ziel
# bereits absolut im eigenen Verweis und laufen ueber die anderen
# location-Bloecke. Ein zweiter Satz Bloecke unter /editor/ waere eine
# zweite, mitzupflegende Kopie derselben Regeln.
#
# ── Vite-Dev vs. gebaute Buendel ─────────────────────────────────────
# Diese Fassung zeigt /play/ auf den laufenden Vite-Dev-Server (5274) —
# richtig fuer ein Labor, das aus den Quellen faehrt (tools/wov-update.sh
# startet auf dieser Instanz KEINEN Client-Build, siehe dort). Sobald
# stattdessen gebaute Buendel ausgeliefert werden sollen, ersetzt der
# auskommentierte Block weiter unten den Proxy durch ein statisches
# `alias` auf `client/dist/` — die Bundle-URLs bleiben identisch, weil
# beide Wege von derselben `base: '/play/'` ausgehen.
#
# ── Voraussetzungen auf dem Container ─────────────────────────────────
# Wie bei nginx-live.conf: der Admin-Token gehoert NICHT ins Repo.
#
#   /etc/nginx/wov-admin-token.conf   (0600, root:root)
#       proxy_set_header x-wov-token "<Inhalt von /etc/wov-admin.token>";
#
# Kompression bewusst NICHT hier: Dieser Container ist ein Labor, keine
# Auslieferung an Besucher — deploy/nginx-live.conf begruendet Brotli/Gzip
# ausfuehrlich, hier waere es nur eine zweite Stelle, die man synchron
# halten muesste, ohne dass sie hier etwas nutzt.

server {
    listen 80 default_server;
    server_name _;

    # ── Oeffentlich oder Labor? ──────────────────────────────────────
    # Seit `world-of-vikings.com` auf diesen Container zeigt (Mike,
    # 12.09.2026), erreicht diesen Server ein Name OHNE Basic-Auth. Die
    # uebrigen Namen (live.dev, editor.dev, *.staging) haengen im Nginx
    # Proxy Manager weiter hinter Zugriffsliste 1.
    #
    # Zwei Wege duerfen deshalb unter dem oeffentlichen Namen NICHT
    # erreichbar sein:
    #
    #   /api/      Der Block unten legt `x-wov-token` aus
    #              /etc/nginx/wov-admin-token.conf bei. Wer ihn ohne
    #              Schranke aufrufen kann, hat den vollen Betriebsdienst:
    #              Weltdokument schreiben, Konsole, Dienste. Die Basic-Auth
    #              war bisher die EINZIGE Schranke davor.
    #   /editor/   Der Welteditor. Kein Passwort, keine Rollen — wer ihn
    #              oeffnet, bearbeitet Mikes Welt.
    #
    # `/api/accounts/` und `/api/*.json` bleiben offen: Das eine ist die
    # Anmeldung, ohne die die Webseite nicht funktioniert, das andere sind
    # statische Dateien der Webseite. Beide gewinnen ohnehin gegen `/api/`
    # (laengster Praefix bzw. Regex), der Schalter hier steht nur im
    # `/api/`-Block selbst.
    #
    # Warum eine Pruefung auf den NAMEN und keine zweite `server`-Sektion:
    # Eine zweite Sektion muesste jeden der zehn location-Bloecke doppeln,
    # und die beiden Faelle liefen ab dem ersten Tag auseinander. Der
    # Name ist auch keine schwache Schranke: Von aussen ist dieser
    # Container gar nicht erreichbar, jede Anfrage kommt ueber den Proxy
    # Manager, und der setzt `Host` auf den angefragten Namen.
    set $oeffentlich 0;
    if ($host ~* "^(www\.)?world-of-vikings\.com$") {
        set $oeffentlich 1;
    }

    # ── Editor-Name: die Wurzel fuehrt in den Editor ─────────────────
    # `editor.dev.world-of-vikings.com` zeigt im Nginx Proxy Manager (Proxy-
    # Host 16, Basic-Auth) auf DIESEN Server. Bis zum 12.09.2026 stand er
    # direkt vor Vite, und Vite leitete `/` nach `/editor.html` um. Seit dem
    # einen Ursprung entscheidet diese Datei nur nach dem PFAD, und `/`
    # gehoert der Webseite — wer den Editor-Namen ohne Pfad aufrief, sah
    # deshalb die Webseite statt des Editors.
    #
    # Umgeleitet wird nur, was heute in `location /` landet (Webseite:
    # `/`, `/de`, `/robots.txt` ...). Alles mit eigenem Block bleibt, wie es
    # ist: /editor/, /play/, /assets/, /api/, /accounts/, /ws und
    # /_app/immutable/ — der Editor braucht sie alle. Jeder andere Name
    # (world-of-vikings.com, live.dev, IP, localhost) sieht diese Regel
    # nicht. `$host` ist schon klein geschrieben und ohne Port; `~*` und
    # die Verankerung schliessen `xeditor.dev...` und `editor.dev....evil`
    # aus. Dieselbe Bauart wie `$oeffentlich` oben, bewusst kein `map`.
    set $editor_name 0;
    if ($host ~* "^editor\.dev\.world-of-vikings\.com$") {
        set $editor_name 1;
    }

    # ── Umleitungen gehen mit RELATIVEM Ort hinaus ────────────────────
    # Hier kommt Klartext-HTTP auf Port 80 an; TLS endet im Proxy Manager.
    # Ohne diese Zeile schreibt nginx in jede Umleitung, die es selbst
    # erzeugt, `http://<Host>[:Port]` hinein — der Besucher, der `https://`
    # benutzt, wuerde also auf `http://` weitergeschickt (`/editor` -> 301
    # und `/play` -> 301 taten das bisher, ebenso die 302 oben).
    #
    # Auf der `server`-Ebene, nicht in einer `location`: Eine Direktive in
    # `location /` gilt nur dort. `location = /editor` und `location = /play`
    # erzeugen ihre 301 selbst und blieben absolut (gemessen 18.09.2026:
    # `/editor` lieferte weiter `http://<Host>:<Port>/editor/`).
    #
    # Wirkung ueber die eigenen Umleitungen hinaus, und die sollte man
    # kennen: Sie gilt auch fuer Antworten aus `proxy_pass`. Zeigt ein
    # Upstream mit einer absoluten Adresse auf SICH SELBST (etwa
    # `Location: http://127.0.0.1:3000/x`), ersetzt `proxy_redirect` sie
    # standardmaessig durch `/x`, und `absolute_redirect off` laesst es dabei;
    # sonst wuerde nginx daraus `http://<Host>:<Port>/x` machen. Adressen,
    # die nicht auf den Upstream zeigen, und relative Orte fasst nginx nicht
    # an. Die Webseite und der Spielserver liefern heute nur relative Orte
    # (`/de/` -> 308 `/de`), deshalb aendert sich fuer sie nichts Sichtbares.
    absolute_redirect off;

    # ── Sicherheits-Kopfzeilen ────────────────────────────────────────
    # Gelten fuer jede Antwort dieses Servers. `add_header` vererbt sich
    # nicht, sobald ein innerer Block selbst eines setzt — deshalb bindet
    # dieselbe Datei auch `location /` und `/_app/immutable/` ein.
    # Begruendung und Werte: deploy/nginx/wov-kopfzeilen.conf
    include /opt/worldofvikings/deploy/nginx/wov-kopfzeilen.conf;

    # ── Webseite (wov-web, adapter-node) ─────────────────────────────
    # Seit „Das Thing" (16.09.2026) rendert die Webseite bei der Anfrage:
    # Der Node-Adapter liefert die VORGERENDERTEN Seiten UND die neuen
    # Forum-Seiten aus EINEM Dienst (127.0.0.1:3000, wov-web.service).
    # nginx reicht `/` deshalb an ihn weiter.
    #
    # Die gehashten Buendel (/_app/immutable/), die statischen Daten unter
    # /api/*.json und die Web-Assets unter /assets/ liegen weiterhin als
    # DATEIEN in wov-web/build/client — sie kommen aus demselben Build,
    # aendern sich aber nie unter demselben Namen. Sie direkt auszuliefern
    # spart den Umweg ueber Node und haelt die bestehenden Cache-Regeln.
    #
    # Voraussetzung auf dem Container: wov-web.service laeuft (sonst 502).
    # adapter-node bedient vorgerenderte Seiten zuerst und faellt fuer
    # `prerender = false` (Forum) auf Rendering bei der Anfrage zurueck.
    root /opt/worldofvikings/wov-web/build/client;
    index index.html;

    # ── Gehashte Build-Artefakte (SvelteKit `_app/immutable`) ─────────
    # Die Dateinamen tragen einen Inhalts-Hash: eine Aenderung erzeugt
    # einen neuen Namen, der alte Pfad wird nie ueberschrieben. Deshalb
    # duerfen sie dauerhaft im Cache liegen. Der Praefix ist laenger als
    # `/` und gewinnt damit; sein eigenes `add_header` erzwingt das
    # erneute Einbinden der Sicherheitskoepfe (siehe Snippet).
    location /_app/immutable/ {
        include /opt/worldofvikings/deploy/nginx/wov-kopfzeilen.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        # Editor-Name (siehe `$editor_name` oben): Wurzel -> Editor. 302
        # und kein 301, damit sich kein Browser die Umleitung dauerhaft
        # merkt. Erste Anweisung des Blocks: nginx braucht das nicht (das
        # `if` laeuft ohnehin vor dem `proxy_pass`), aber so liest man es
        # zuerst, und der Test haelt es fest. Der Ort geht relativ hinaus,
        # siehe `absolute_redirect` oben auf der `server`-Ebene.
        if ($editor_name) { return 302 /editor/; }

        # HTML und die uebrigen Wurzeldateien (robots.txt, sitemap.xml,
        # site.webmanifest). `no-cache` heisst „vor Gebrauch revalidieren",
        # nicht „nicht speichern" — mit dem bereits gesetzten ETag sind das
        # 304-Antworten. Das eigene `add_header` verlangt die erneute
        # Einbindung der Sicherheitskoepfe.
        include /opt/worldofvikings/deploy/nginx/wov-kopfzeilen.conf;
        add_header Cache-Control "no-cache" always;

        # Alles, was keine Datei ist, entscheidet der Node-Dienst: die
        # vorgerenderten Seiten liefert er aus `build/prerendered`, die
        # Forum-Seiten rendert er bei der Anfrage.
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Herkunft und Protokoll WEITERGEBEN: SvelteKit baut daraus die
        # absoluten Adressen (canonical, hreflang) — ohne diese drei Zeilen
        # stuenden dort `http://127.0.0.1:3000` statt der oeffentlichen
        # Adresse. X-Forwarded-For anhaengen ist hier richtig (anders als
        # bei den Spiel-API-Bloecken): Dieser Dienst liest nur die
        # Protokoll-/Hostangaben, keine Teilnehmeradressen.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Dieselbe Umleitung wie bei /editor — "/play" ohne Schraegstrich
    # matcht das Praefix "/play/" unten nicht und faellt sonst auf /.
    location = /play {
        return 301 /play/;
    }

    # ── Spiel-Client (Vite-Dev, base: '/play/') ──────────────────────
    location /play/ {
        proxy_pass http://127.0.0.1:5274;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Vites eigenes HMR laeuft als WebSocket-Upgrade auf DEMSELBEN
        # Pfad-Praefix — ohne diese beiden Zeilen bliebe die Dev-Konsole
        # bei "connecting..." haengen, auch wenn die Seite laedt.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Spaeter: gebaute Buendel statt Vite-Dev ──────────────────────
    # location /play/ {
    #     alias /opt/worldofvikings/client/dist/;
    #     try_files $uri $uri/ =404;
    # }

    # Ohne Schraegstrich auf MIT umleiten — sonst faellt "/editor" (kein
    # Server-Verzeichnis, das nginx selbst umleiten koennte) durch auf
    # location / und liefert dort ein ehrliches, aber falsches 404.
    location = /editor {
        if ($oeffentlich) { return 404; }
        return 301 /editor/;
    }

    # ── Editor-Einstieg ───────────────────────────────────────────────
    # Nur die HTML-Anfrage wird umgeschrieben; alles Weitere (Skripte,
    # /assets/…) adressiert sich ueber `base: '/play/'` bereits selbst.
    location = /editor/ {
        if ($oeffentlich) { return 404; }
        rewrite ^ /play/editor.html break;
        proxy_pass http://127.0.0.1:5274;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Statische Daten der Webseite unter /api/ ─────────────────────
    # wov-web/static/api/*.json (z. B. welt.json, saga.json, recken.json)
    # landen per adapter-static unveraendert in wov-web/build/api/ — flach,
    # OHNE Unterordner. Die REGEX-location matcht deshalb bewusst nur EINE
    # Ebene ([^/]+\.json) und gewinnt wegen der nginx-Regel "Regex schlaegt
    # jede Praefix-location" zuverlaessig gegen /api/accounts/ UND /api/,
    # ohne dass admin/src/main.ts je einen Pfad auf `.json` prueft (keine
    # Kollision moeglich). Fehlt eine Datei, liefert dieser Block ehrlich
    # 404 statt stillschweigend an den Betriebsdienst durchzufallen.
    location ~ ^/api/([^/]+\.json)$ {
        # root statt alias: `try_files $uri` prueft mit alias den falschen
        # Pfad (bekannte nginx-Falle), mit root wird /api/welt.json zu
        # build/client/api/welt.json. root, not alias: try_files with alias
        # checks the wrong path.
        root /opt/worldofvikings/wov-web/build/client;
        try_files $uri =404;
    }

    # ── Konten-API des Spielservers ───────────────────────────────────
    # /api/accounts/xyz -> /accounts/xyz auf dem Spielserver (2467).
    # KEIN /api-Anteil auf der Zielseite — siehe Begruendung oben im Kopf.
    location /api/accounts/ {
        rewrite ^/api/accounts/(.*)$ /accounts/$1 break;
        proxy_pass http://127.0.0.1:2467;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Die Versuchssperre der Konten-API (Registrierung UND Anmeldung,
        # server/src/konto/KontoApi.ts) zaehlt je Herkunft — ohne diese
        # beiden Zeilen saehe der Dienst nur 127.0.0.1 und sperrte nach
        # fuenf Fehlgriffen ALLE.
        #
        # UEBERSCHREIBEN, nicht anhaengen (wie im /api/-Block unten, nicht
        # $proxy_add_x_forwarded_for): server/src/net/Herkunft.ts liest den
        # ERSTEN Eintrag als Herkunft, sobald die Peer-Adresse Loopback ist
        # — und die Peer-Adresse HIER, aus Sicht des Spielservers, ist
        # immer dieser nginx (Loopback). Ein $proxy_add_x_forwarded_for
        # wuerde einen von aussen mitgeschickten X-Forwarded-For-Kopf nur
        # ERGAENZEN statt ersetzen; kaeme dieser Kopf ungefiltert bis
        # hierher durch, bliebe eine selbst erfundene erste Adresse einer
        # anfragenden Herkunft die Adresse, die als ERSTE ankommt — und
        # genau die liest Herkunft.ts.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Das Thing (Forum) ─────────────────────────────────────────────
    # /api/forum/xyz -> /forum/xyz auf dem Spielserver (2467), genau wie
    # die Konten-API daneben. Lesen ist oeffentlich (ohne Token); Schreiben
    # kommt in einer spaeteren Stufe und braucht dann ein Kontotoken, das
    # derselbe Dienst prueft. X-Forwarded-For UEBERSCHREIBEN, nicht
    # anhaengen — dieselbe Begruendung wie bei den Konten darueber.
    location /api/forum/ {
        rewrite ^/api/forum/(.*)$ /forum/$1 break;
        proxy_pass http://127.0.0.1:2467;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Konten-API, bare (ohne /api-Anteil), fuer den Spiel-Client selbst
    # ────────────────────────────────────────────────────────────────
    # Der eingebaute Anmeldedialog des Clients (client/src/ui/Anmeldung.ts,
    # Bauer "Anmeldung") ruft `fetch('/accounts/...')` auf — bewusst OHNE
    # das `/api`-Praefix, weil er den Ursprung mit der Webseite teilt und
    # der Spielserver selbst nur `/accounts/...` versteht. Im Vite-Dev-
    # Betrieb bedient client/vite.config.ts (server.proxy['/accounts/'])
    # diesen Pfad zusaetzlich zu diesem Block; unter nginx (dieser Datei)
    # WAERE er ohne dieses `location`ohne Ziel gewesen und auf `location /`
    # (die statische Webseite) mit 404 gelandet — ein reiner Textzugriff
    # anstelle des Kontos. KEIN rewrite noetig: die Zielseite versteht den
    # Pfad bereits woertlich.
    location /accounts/ {
        proxy_pass http://127.0.0.1:2467;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # UEBERSCHREIBEN, nicht anhaengen — dieselbe Begruendung wie im
        # /api/accounts/-Block oben.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Betriebsdienst ────────────────────────────────────────────────
    # OHNE rewrite: admin/src/main.ts erwartet den /api-Anteil woertlich
    # (`pfad === '/api/worldlayout'` usw.) — genau wie der Vite-Dev-Proxy
    # (client/vite.config.ts) ihn schon immer unveraendert durchreicht.
    location /api/ {
        # 404 und nicht 403: Ein 403 sagt "hier ist etwas, du darfst nur
        # nicht" — der Betriebsdienst soll unter dem oeffentlichen Namen
        # gar nicht erst als vorhanden gelten.
        if ($oeffentlich) { return 404; }
        include /etc/nginx/wov-admin-token.conf;

        proxy_pass http://127.0.0.1:2468;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # UEBERSCHREIBEN, nicht anhaengen: admin/src/main.ts liest den
        # ERSTEN Eintrag als Herkunft. Ein $proxy_add_x_forwarded_for
        # liesse jeden Aufrufer sich selbst eine erlaubte Adresse
        # voranstellen (dieselbe Begruendung wie in nginx-live.conf).
        proxy_set_header X-Forwarded-For $remote_addr;

        client_max_body_size 32m;

        # Server-Sent-Events (/api/serverlog) — ohne diese vier Zeilen
        # kommt kein einziges Ereignis an, weil nginx sonst puffert, bis
        # der Strom endet, was er nie tut.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Spielserver-WebSocket ─────────────────────────────────────────
    # Der Client bildet die Adresse selbst als wss://<host>/ws
    # (client/src/main.ts) — UNABHAENGIG von /play/, weil location.host
    # keinen Pfad traegt. Das Vite-Plugin gameWsProxy (client/vite.config.ts)
    # macht im Dev-Betrieb dasselbe; hier uebernimmt nginx es zusaetzlich
    # auf Ebene des einen Ursprungs, sodass ein spaeterer Wechsel auf
    # gebaute Buendel (ohne Vite-Prozess) nichts an dieser Regel aendert.
    location /ws {
        proxy_pass http://127.0.0.1:2467;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Dieselbe Herkunfts-Zeile wie bei den Konten-Bloecken oben:
        # server/src/net/WebSocketAcceptor.ts liest die Verbindungsadresse
        # jetzt ueber Herkunft.ts statt direkt aus dem Socket — ohne diese
        # beiden Kopfzeilen saehe der Spielserver fuer jeden Spieler
        # denselben Loopback-Wert. UEBERSCHREIBEN, nicht anhaengen.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Assets: zuerst die Webseite, sonst das Spiel ─────────────────
    # wov-web/static/assets/ (Schriften, Wappen/Held-Bilder, Karten-
    # Vorschauen, appearance.json) landet per adapter-static unveraendert
    # in wov-web/build/assets/ — DENSELBEN URL-Praefix `/assets/`, den
    # auch die Spiel-Assets belegen (assetHandler, client/vite.config.ts).
    # `try_files $uri @spiel-assets` prueft deshalb ERST die Webseite und
    # faellt nur bei einer echten 404 auf den benannten Fallback-Block
    # zurueck — zwei Verzeichnisse hinter EINEM Praefix, ohne dass eine
    # Datei in beiden vorkommen darf.
    location /assets/ {
        alias /opt/worldofvikings/wov-web/build/client/assets/;
        try_files $uri @spiel-assets;
    }

    # ── Weltkarten: aus dem Zustandsverzeichnis, Rueckfall auf das Repo ─
    # wov-karten.service (tools/weltkarte-veroeffentlichen.mjs) rendert die
    # Karten stuendlich neu und legt sie atomar nach
    # /var/lib/wov-karten/oeffentlich/. Das liegt AUSSERHALB von
    # wov-web/build: Jeder Rollout ersetzt build/ komplett und liesse die
    # frischen Karten sonst verschwinden oder auf den Stand im Repo
    # zurueckspringen. nginx waehlt den laengsten Praefix — dieser Block
    # gewinnt gegen `/assets/`. Fehlt eine Datei (frische Installation,
    # Job lief noch nie), greift @karten-repo und liefert die Karte aus
    # wov-web/static/assets/karten/, wie sie im Bau liegt. Eine Loesung in
    # nginx statt im SvelteKit-Dienst, weil es reine Dateien sind: kein
    # Node-Neustart noetig, und die Karte bleibt sichtbar, auch wenn
    # wov-web.service haengt.
    location /assets/karten/ {
        alias /var/lib/wov-karten/oeffentlich/;
        try_files $uri @karten-repo;
        # Die Uebersicht wird stuendlich erneuert; die Bilder aendern sich
        # nur mit der Welt. Kurz cachen, damit eine neue Karte zeitnah
        # ankommt.
        add_header Cache-Control "public, max-age=300";
        include /opt/worldofvikings/deploy/nginx/wov-kopfzeilen.conf;  # add_header erbt sonst nicht
    }

    location @karten-repo {
        # root, nicht alias (benannte location, s. @spiel-assets): /assets/
        # karten/x wird zu <root>/assets/karten/x.
        root /opt/worldofvikings/wov-web/build/client;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
        include /opt/worldofvikings/deploy/nginx/wov-kopfzeilen.conf;  # add_header erbt sonst nicht
    }

    # Derselbe Ordner, den `assetHandler` im Vite-Dev-Server ausliefert
    # (client/vite.config.ts) — inklusive der zur Laufzeit erzeugten
    # Unterordner (`assets/generiert/`, s. dort). `alias`, nicht `root`:
    # der URL-Praefix `/assets/` selbst gehoert nicht zum Dateipfad. Ein
    # benannter Block statt einer zweiten `location /assets/`, weil nginx
    # pro Praefix nur EINE location zulaesst — der Fallback von oben
    # springt hierher, wenn die Webseite die Datei nicht hat.
    location @spiel-assets {
        # root statt alias: in einer benannten location ist alias verboten
        # (nginx -t: "the alias directive cannot be used inside the named
        # location"); mit root wird /assets/x zu /opt/worldofvikings/assets/x.
        # root, not alias: alias is not allowed inside a named location.
        root /opt/worldofvikings;
        try_files $uri =404;
    }
}
