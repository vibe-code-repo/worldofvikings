<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World of Vikings</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #renderCanvas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      /*
       * UI ausblenden (F1) — fuer Bildschirmfotos und um die Welt ohne
       * Aufbauten zu sehen.
       *
       * WARUM EINE REGEL UEBER ALLE KINDER STATT EINER LISTE: Jedes
       * Fenster, jede Anzeige und jeder Hinweis haengt direkt an <body>
       * (HUD, Hotbar, Minimap, Weltzeit, Inventar, Charakterfenster,
       * Chat, Meldungen, Fehler-Toasts, Sperr-Hinweis ...). Eine Liste
       * muesste bei jedem neuen Element nachgezogen werden, und ein
       * vergessenes Element macht die ganze Taste nutzlos: Man merkt es
       * erst auf dem Bild. Diese Regel erfasst auch, was spaeter dazukommt.
       *
       * Der Canvas ist ausgenommen — er IST das Spiel.
       */
      body.ui-versteckt > *:not(#renderCanvas) { display: none !important; }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
