<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World of Vikings</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #renderCanvas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      #connect-screen {
        position: fixed; inset: 0; z-index: 100;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #1a1208 0%, #0d0a05 100%);
        font-family: 'Segoe UI', sans-serif;
      }
      #connect-screen .panel {
        background: rgba(30, 22, 12, 0.95); border: 2px solid #5a4a2a;
        border-radius: 12px; padding: 32px; text-align: center; min-width: 340px;
      }
      #connect-screen h1 { color: #c9a84c; font-size: 24px; margin: 0 0 16px; }
      #connect-screen input {
        width: 100%; padding: 9px 12px; margin: 5px 0; border-radius: 6px;
        border: 1px solid #5a4a2a; background: #1a1208; color: #e8d5a3;
        font-size: 14px; outline: none; box-sizing: border-box;
      }
      #connect-screen input:focus, #connect-screen select:focus { border-color: #c9a84c; }
      #connect-screen select {
        width: 100%; padding: 9px 12px; margin: 5px 0; border-radius: 6px;
        border: 1px solid #5a4a2a; background: #1a1208; color: #e8d5a3;
        font-size: 14px; outline: none; box-sizing: border-box; cursor: pointer;
      }
      #connect-screen .field-label {
        display: block; color: #c9a84c; font-size: 13px;
        margin: 12px 0 0; text-align: left;
      }
      #time-hint { color: #8a7a5a; font-size: 11px; margin: 2px 0 0; text-align: left; min-height: 14px; }
      #connect-screen label.check { display: flex; align-items: center; gap: 8px; color: #c9a84c; font-size: 13px; margin: 10px 0 2px; text-align: left; }
      .seed-row { display: flex; gap: 6px; }
      .seed-row input { flex: 1; }
      .seed-row button {
        flex: 0 0 auto; padding: 0 14px; border-radius: 6px; border: 1px solid #5a4a2a;
        background: #2a2015; color: #e8d5a3; cursor: pointer; font-size: 16px;
      }
      .seed-row button:hover { background: #3a2c1c; }
      #seed-hint { color: #8a7a5a; font-size: 11px; margin: 2px 0 8px; text-align: left; min-height: 14px; }
      #connect-btn {
        width: 100%; padding: 11px; margin-top: 10px; border-radius: 6px;
        border: none; background: linear-gradient(135deg, #8b6914, #c9a84c);
        color: #1a1208; font-size: 15px; font-weight: bold; cursor: pointer;
      }
      #connect-btn:hover { filter: brightness(1.15); }
      #connect-btn:disabled { opacity: 0.6; cursor: default; }
      #connect-status { color: #8a7a5a; font-size: 12px; margin-top: 10px; min-height: 16px; }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>

    <div id="connect-screen">
      <div class="panel">
        <h1>⚔ Valheim Babylon</h1>
        <input type="text" id="player-name" placeholder="Spielername" value="Viking" />
        <input type="text" id="server-url" placeholder="Server-URL" />
        <label class="check"><input type="checkbox" id="offline-toggle" /> Offline (nur lokal, ohne Server)</label>
        <div class="seed-row">
          <input type="text" id="world-seed" placeholder="Seed (leer = zufällig)" />
          <button type="button" id="gen-seed-btn" title="Zufälligen Seed erzeugen">🎲</button>
        </div>
        <div id="seed-hint">Seed wird vom Server vorgegeben (nur im Offline-Modus wählbar).</div>
        <label class="field-label" for="start-time">Uhrzeit</label>
        <!-- Optionen werden in main.ts erzeugt, damit die Tageszeit-Marken
             (Sonnenaufgang/Mittag/Sonnenuntergang) aus demselben Modell
             kommen wie die Beleuchtung und nicht doppelt gepflegt werden. -->
        <select id="start-time"></select>
        <div id="time-hint"></div>
        <button id="connect-btn">Verbinden</button>
        <div id="connect-status"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
