# Weiterleitung der Adressen von vor dem Sprachumbau (23.08.2026).
#
# Bis Schritt 7 des Umbaus erzeugte der Build build/saga.html, build/karte.html,
# build/ruestkammer.html, build/ruhmeshalle.html, build/thing.html und
# build/erstellen.html direkt unter der Wurzel. Seither liegen dieselben
# Seiten unter /de/... und /en/..., und die alten Dateien werden nicht mehr
# gebaut — ohne diese Datei antwortet der `location /`-Block weiter unten mit
# 404 auf jeden bestehenden Link, jedes Lesezeichen und jeden von Suchmaschinen
# bereits indexierten Treffer auf die alten Adressen.
#
# Ziel ist immer /de/..., nicht abhaengig von Accept-Language: Genau so
# verhaelt sich auch die Sprachweiche unter / selbst (src/routes/+page.svelte,
# DEFAULT_LOCALE = 'de') — wer auf /en/... unterwegs war und einem alten Link
# folgt, landet also auf Deutsch und muss selbst umschalten. Das ist die
# gleiche Grenze, die die Webseite an jeder anderen Stelle auch zieht.
#
# `rewrite` mit `permanent` ist ein echtes HTTP 301, kein `location`-Block:
# Diese Zeilen muessen im server{}-Block stehen, NICHT innerhalb von
# `location / { ... }` — nginx wertet Server-Rewrites vor der
# Location-Auswahl aus, die genaue Position im Block ist daher nicht
# entscheidend, gehoert aber laut Konvention dieser Datei VOR `location /`.
#
# Das optionale `.html` im Muster faengt Links ab, die die alte Endung noch
# in der Adresszeile trugen (z. B. aus einer alten Sitemap-Kopie).
# Absolut mit https, nicht relativ: nginx baut die Zieladresse sonst aus
# \$scheme, und der Proxy spricht mit diesem Container KLARTEXT -- die
# Weiterleitung zeigte dann auf http://, der Browser landete erst dort
# und wurde von vorne nach https geschickt. Ein Sprung mehr, und einer
# davon unverschluesselt.
rewrite ^/(saga|karte|ruestkammer|ruhmeshalle|thing|erstellen)(\.html)?$ https://$host/de/$1 permanent;

# ── Deutsche Slugs unter /en/ (24.08.2026) ───────────────────────────────
#
# Der Sprachumbau gab jeder Seite ein Sprachpraefix, aber noch keinen eigenen
# Slug: Die englische Ruestkammer lief unter /en/ruestkammer. Seit die
# Slug-Tabelle in src/lib/i18n/index.ts steht, baut der Build die englischen
# Seiten unter englischen Adressen — /en/armory, /en/login, /en/account. Die
# alten Adressen sind ausgerollt gewesen, stehen also in Lesezeichen, in
# fremden Links und moeglicherweise im Index einer Suchmaschine. Ohne diese
# Zeilen antwortet der `location /`-Block darauf mit 404.
#
# Warum jede Zeile einzeln steht: Die Regel darueber kann mit EINER
# Capture-Gruppe auskommen, weil sich dort nur das Praefix aendert und das
# Wort gleich bleibt. Hier ist das Zielwort je Quellwort ein anderes, und
# `rewrite` kann nicht in einer Tabelle nachschlagen.
#
# saga und thing fehlen absichtlich: Ihr Slug ist in beiden Sprachen
# derselbe, /en/saga ist schon die richtige Adresse.
#
# Die Regel oben (/ruestkammer -> /de/ruestkammer, ohne Sprachpraefix) bleibt
# unveraendert richtig — sie betrifft einen frueheren Adress-Stand.
#
# Absolut mit https und `permanent`, aus denselben Gruenden wie oben.
rewrite ^/en/ruestkammer(\.html)?$ https://$host/en/armory permanent;
rewrite ^/en/ruhmeshalle(\.html)?$ https://$host/en/hall-of-fame permanent;
rewrite ^/en/karte(\.html)?$ https://$host/en/map permanent;
rewrite ^/en/anmelden(\.html)?$ https://$host/en/login permanent;
rewrite ^/en/registrieren(\.html)?$ https://$host/en/register permanent;
rewrite ^/en/konto(\.html)?$ https://$host/en/account permanent;
rewrite ^/en/erstellen(\.html)?$ https://$host/en/create permanent;

# Absichtlich NICHT hier: eine Weiterleitung fuer die Wurzel `/`. Sie bleibt
# unveraendert erreichbar — build/index.html ist die Sprachweiche aus
# src/routes/+page.svelte (meta-refresh, funktioniert ohne JavaScript) und
# wird vom bestehenden `location /`-Block ganz normal ausgeliefert. Ein
# zusaetzliches `rewrite ^/$ ...` waere nicht falsch, aber ueberfluessig und
# wuerde das im Repo gepflegte 200-mit-Weiche stumpf durch ein serverseitiges
# 301 ersetzen, ohne dass irgendetwas dadurch gewonnen waere.
