# World of Vikings — Auslieferung der Live-Instanz (Container wov-live).
#
# Ziel: /etc/nginx/sites-available/wov  (Symlink in sites-enabled)
# Ausrollen: deploy/nginx-ausrollen.sh
#
# Der Nginx Proxy Manager auf dem Host terminiert TLS und reicht hierher
# durch. Diese Datei macht dreierlei: den statischen Client ausliefern,
# /ws an den Spielserver weitergeben — die Aufgabe, die im
# Entwicklungsbetrieb das Vite-Plugin gameWsProxy uebernimmt — und /api/
# an den Betriebsdienst, wofuer auf dev der Vite-Proxy zustaendig ist.
#
# ── VORAUSSETZUNGEN AUF DEM CONTAINER ────────────────────────────────
# Zwei Dateien liegen NICHT im Repo und muessen vor dem ersten Neuladen
# existieren, sonst startet nginx nicht:
#
#   /etc/nginx/wov-admin-token.conf   (0600, root:root)
#       proxy_set_header x-wov-token "<Inhalt von /etc/wov-admin.token>";
#
#   /etc/nginx/wov-editor.htpasswd    (0640, root:www-data)
#       htpasswd -c /etc/nginx/wov-editor.htpasswd weltbau
#
# Beide gehoeren zum Container, nicht zum Code — dasselbe Prinzip wie bei
# /etc/wov.env. Ein Token im Repo waere ein Token, den man nie wieder
# wechselt.
#
# ── Kompression ──────────────────────────────────────────────────────
# Die Direktiven stehen im SERVER-Block, nicht davor: sites-enabled wird
# in den http-Kontext eingebunden, und dort setzt Debians nginx.conf
# bereits `gzip on` — ein zweites Mal auf derselben Ebene ist ein
# Startfehler ("gzip directive is duplicate").
# Debians nginx.conf setzt `gzip on;`, aber `gzip_types` steht dort auf
# der Vorgabe `text/html`. Genau deshalb ging das Haupt-Bundle mit
# 1 496 584 Bytes UNKOMPRIMIERT ueber die Leitung: JavaScript ist
# application/javascript und war nie erfasst. Ohne die Typenliste ist
# `gzip on` faktisch wirkungslos.
#
# Brotli zusaetzlich, weil es auf JavaScript rund 15 bis 20 % besser
# packt als gzip und jeder aktuelle Browser es kann; gzip bleibt als
# Rueckfall fuer alles andere.
#
# NICHT komprimiert werden GLB und PNG. GLB traegt seine Texturen als
# PNG/JPEG im Inneren, PNG ist selbst schon Deflate — beides erneut zu
# packen kostet CPU und bringt im niedrigen einstelligen Prozentbereich
# nichts. Wer daran dreht, sollte vorher messen.

server {
    listen 80 default_server;
    server_name _;

    # Brotli (Modul libnginx-mod-http-brotli-filter). Die Datei laedt es
    # nicht selbst — das passiert ueber /etc/nginx/modules-enabled/.
    brotli on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types
        application/javascript
        application/json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;


    root /opt/worldofvikings/client/dist;
    index index.html;

    # Der Editor gehoert NICHT auf die Live-Instanz — er lebt im
    # Container wov-bau hinter Passwort. Der Build erzeugt die Seite,
    # ausgeliefert wird sie hier nicht.
    location = /editor.html { return 404; }

    # Spielserver-WebSocket. Der Client bildet die Adresse selbst als
    # wss://<host>/ws (client/src/main.ts).
    location /ws {
        proxy_pass http://127.0.0.1:2467;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Betriebsdienst: Weltdokument und Server-Konsole ──────────────
    #
    # GET/POST /api/worldlayout und GET /api/serverlog. Auf dev macht das
    # der Vite-Proxy (client/vite.config.ts, server.proxy); hier steht das
    # Gegenstueck, damit der Editor auf BEIDEN Containern funktioniert.
    # Vorher gab es diese Endpunkte auf live ueberhaupt nicht — der
    # Speicherknopf lief ins Leere.
    location /api/ {
        # ── Zweite Schranke ──────────────────────────────────────────
        # Der Nginx Proxy Manager auf dem Host hat eine eigene Basic-Auth.
        # Sie reicht hier NICHT: Wer nur dieses Passwort kennt, soll das
        # Weltdokument nicht ueberschreiben koennen. Also eine zweite,
        # unabhaengige Anmeldung mit eigener htpasswd-Datei AUF DIESEM
        # Container.
        #
        # Warum nicht stattdessen ein IP-Filter wie im alten Vite-Plugin
        # (127.0.0.1, 10.10.10.*, 192.168.*)? Weil $remote_addr hier immer
        # die Bruecken-Adresse des Proxy Managers ist — ein IP-Filter
        # koennte gar nichts unterscheiden und wuerde jede Anfrage
        # durchlassen, die durch den Proxy kam. Genau deshalb steht in
        # `allow` NUR 127.0.0.1 und ausdruecklich nicht 10.10.10.0/24:
        # Von der Bruecke kommt der Proxy Manager, und der ist es, gegen
        # den diese Schranke steht.
        #
        # `satisfy any` heisst: lokale Werkzeuge auf dem Container selbst
        # (curl, Wartungsskripte) kommen ohne Passwort durch, alles ueber
        # den Proxy muss sich anmelden.
        satisfy any;
        allow 127.0.0.1;
        deny all;
        auth_basic "World of Vikings — Weltdokument";
        auth_basic_user_file /etc/nginx/wov-editor.htpasswd;

        # Der Token, den der Betriebsdienst verlangt. Aus einer eigenen
        # Datei (0600), damit er nicht im Repo landet und ohne Codeaenderung
        # gewechselt werden kann. Er wird SERVERSEITIG gesetzt und taucht
        # im Browser nie auf — dasselbe Prinzip wie beim Vite-Proxy.
        include /etc/nginx/wov-admin-token.conf;

        # Der Dienst lauscht auf der internen Bruecke, nicht auf localhost
        # (admin/src/main.ts, WOV_ADMIN_ADRESSE — auf live 10.10.10.11).
        proxy_pass http://10.10.10.11:2468;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # UEBERSCHREIBEN, nicht anhaengen ($proxy_add_x_forwarded_for waere
        # falsch): Der Betriebsdienst liest den ersten Eintrag als Adresse
        # des Aufrufers. Haengte man an, koennte sich jeder Aufrufer selbst
        # eine erlaubte Adresse davorschreiben.
        proxy_set_header X-Forwarded-For $remote_addr;

        # Das Weltdokument ist heute 56 KB und waechst mit jeder Region.
        # Die Vorgabe von 1 MB wuerde irgendwann still ein 413 liefern —
        # mitten in einem Speichervorgang, den der Nutzer fuer erledigt
        # haelt. Grosszuegig, es ist genau ein JSON-Dokument.
        client_max_body_size 32m;

        # ── Server-Sent-Events (/api/serverlog) ──────────────────────
        # Ohne diese vier Zeilen kommt KEIN einziges Ereignis an: nginx
        # sammelt die Antwort im Puffer, und ein Strom wird nie fertig.
        # gzip/brotli muessen mit weg — ein Kompressor puffert ebenfalls,
        # bis er genug Material hat.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        brotli off;
        # Ein Editor-Tab haelt die Konsole stundenlang offen; die Vorgabe
        # von 60 s wuerde ihn im Minutentakt neu verbinden lassen.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Gehashte Build-Artefakte — duerfen dauerhaft im Cache bleiben.
    location /bundle/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Spiel-Assets (GLB, Texturen, Icons) aus dem Projektordner.
    location /assets/ {
        alias /opt/worldofvikings/assets/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        # Bereits komprimierte Formate nicht noch einmal anfassen.
        gzip off;
        brotli off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
