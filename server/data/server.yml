# World of Vikings Server Configuration
# Aufbau übernommen aus der data/server.yml des C++-Referenzservers
#
# WAS HIER STEHT, WIRKT AUCH. Jeder Schluessel dieser Datei wird in
# server/src/ServerKonfig.ts ausgewertet; was dort nicht in
# BEKANNTE_SCHLUESSEL steht, meldet der Server beim Start als
# "liest niemand" statt es stumm zu ignorieren. Festgehalten in
# server/test/a14-server-yml.ts. Das ist der Riegel gegen den Zustand,
# den A14 aufgeraeumt hat: sechzehn Schluessel, die etwas versprachen und
# nichts bewirkten.
#
# WO DIE GESTRICHENEN ZUGANGS-SCHLUESSEL HEUTE LEBEN (A14):
#   authenticate  Der Handshake authentifiziert IMMER, ein Schalter dafuer
#                 waere sinnlos: server/src/net/NetManager.ts laesst vor
#                 der Anmeldung ausschliesslich Handshake-Pakete durch,
#                 und server/src/net/Identitaet.ts vergibt die Spieler-ID
#                 serverseitig und signiert sie als HMAC-SessionToken.
#                 Der alte Schluessel meinte ein Steam-Ticket, das es hier
#                 nie gab.
#   timeout       Fest verdrahtet in NetManager.pruefeTimeouts(): 30 s ohne
#                 Paket fuer angemeldete Peers (der Client pingt alle 5 s),
#                 10 s fuer nicht angemeldete. Bewusst NICHT wieder
#                 konfigurierbar gemacht -- der Wert, der hier zuletzt
#                 stand, war "0s", und der haette die Trennung halboffener
#                 Sockets abgeschaltet statt sie einzustellen.
#   whitelist     Hat KEINEN gleichwertigen Nachfolger. Zugang regelt heute
#                 allein server.password (unten), Rechte regelt die
#                 Admin-Liste (server/src/admin/AdminListe.ts), und
#                 NetManager.kick() wirkt nur bis zum naechsten Verbinden.
#                 Eine dauerhafte Zugangs-/Bannliste fehlt: offene Aufgabe,
#                 kein erledigter Umzug.
#   max-online    War ein Duplikat von players.max (unten).
#   pregenerate   Es gibt keine Vorab-Generierung. Zonen entstehen erst,
#                 wenn ein Spieler in ihre Naehe kommt
#                 (ZoneManager.enqueueNearbyZones), im layout-Modus nur
#                 innerhalb der Layout-Bbox. Ein "true" haette nichts
#                 anzustossen gehabt.

server:
  name: World of Vikings Server
  password: ""
  port: 2467
  # public, dedicated: verworfen (A14, 20.08.) -- es gibt keine Server-
  # Browser-Registrierung (kein Steam-Layer), an die diese Flags anknuepfen
  # koennten; der Prozess ist ohnehin immer "dedicated" (ein Node-Skript,
  # kein Listen-Server mit lokalem Spieler).

players:
  max: 10
  # Verworfen (A14): whitelist, offline, timeout, list-send-interval,
  # max-online, authenticate -- keinen davon las Code. Wo ihre Funktion
  # heute liegt, steht im Kopf dieser Datei; "offline" und
  # "list-send-interval" gehoerten beide zur Steam-Server-Registrierung,
  # die es hier nicht gibt.
  everyone-admin: true

world:
  # Welt und Spielstand bestimmt WOV_INSTANZ (dev|live), nicht diese Datei:
  #   Layout     server/data/welten/<instanz>.json
  #   Spielstand server/data/worlds/<instanz>.db.zst
  # Der Weltname war der einzige Grund, warum server.yml nie mitdeployed
  # werden durfte. Siehe shared/src/instanz.ts.
  # Kartengenerierung: 'valheim' = radialer Seed-Port (Übergangspfad, der
  # Name des Modus stammt noch aus der Anfangszeit und bleibt, weil
  # bestehende Spielstände ihn tragen),
  # 'layout' = designer-definierte Welt aus der layout-Datei (relativ zu data/).
  # Achtung: Der Modus muss zum Save passen — ein Save aus dem radialen
  # Modus gehört nicht unter eine layout-Welt (andere Weltform).
  mode: layout
  # pregenerate, modern, heightmap-threading: verworfen (A14) -- kein Code
  # las sie. Zu pregenerate steht die Begruendung im Kopf dieser Datei;
  # "modern" traf nichts (worldGenVersion ist eine fixe Konstante, kein
  # Schalter aus dieser Datei), und Heightmap-Threading gibt es nicht.
  # save-interval: seit A14 tatsaechlich ausgewertet
  # (ServerKonfig.parseDauerMs -> WovServer.start(), Syntax: 30min | 45s |
  # 500ms | 2h). Vorher stand hier ein Wert, den niemand las -- der Takt kam
  # allein aus SAVE_INTERVAL_MS. Aendern wirkt jetzt; ein unlesbarer Wert
  # ("30 min", "30m") faellt auf diese Konstante zurueck.
  save-interval: 30min
  # Block A: Locations stillgelegt. Alle 146 Einträge in FEATURES sind
  # Fremdexporte; keiner steht in EIGENE_MODELLE. Gebucht würden sie
  # trotzdem — jede Instanz legte ZDOs an, die der Client nicht darstellen
  # kann, und der Spieler liefe durch unsichtbare Grabhügel.
  # Verworfen: nur clientseitig ausblenden. Dann stünden die Geister-ZDOs
  # weiterhin im Save und passten später nicht mehr zu der Buchung, die
  # mit eigenen Modellen entsteht.
  # Gilt für dev UND live: diese Datei ist umgebungsfrei, und der Verzicht
  # auf Fremdmodelle ist eine Projektentscheidung, kein
  # Umgebungsunterschied (shared/src/instanz.ts).
  features: false
  vegetation: true
  creatures: true
  seed: KxSYuZquuw
  # C++ server.yml: experimental-location-overrides: true (ShipSetting01)
  experimental-location-overrides: true
  # C++ server.yml:35 — modern FastNoise Ashlands (ASHLANDS_2.0), C++ default true
  experimental-ashlands-modern-noise: true

  # Auf welcher Hoehe steht der Spieler?
  #
  # AUS (Vorgabe, C++-Port) schnappt getGroundHeight auf den NAECHSTEN
  # Gitterpunkt: floor(v + 0.5). Das Terrain wird aber als Dreiecksnetz
  # zwischen den Punkten gezeichnet. Die Figur laeuft dadurch eine Treppe,
  # waehrend der Hang glatt aussieht -- gemessen am 23.08.2026 auf einer
  # 4-m-Strecke mit 0,307 m Anstieg: fuenf Plateaus, das laengste einen
  # ganzen Meter lang, dazwischen Spruenge von rund 7 cm.
  #
  # AN interpoliert baryzentrisch ueber DIESELBEN Dreiecke, aus denen das
  # Mesh und die Kollision bestehen (T1=v00,v01,v10 / T2=v10,v01,v11).
  # Damit steht die Figur auf dem, was man sieht.
  experimental-bilinear-height-sampling: true

# zdos: Alle vier Werte (send-interval, max-send-threshold,
# min-send-threshold, assign-interval) wurden nie aus dieser Datei
# gelesen -- die tatsaechlichen Werte sind fixe Konstanten in
# shared/src/constants.ts (ZDO_SEND_INTERVAL_MS = 50,
# ZDO_MAX_SEND_THRESHOLD = 10240, ZDO_MIN_SEND_THRESHOLD = 2048,
# ZDO_ASSIGN_INTERVAL_MS = 2000 -- dieselben Zahlen, die hier standen).
# Konfigurierbar machen hiesse, sie durch ZDOManager/WovServer
# durchzureichen -- ein groesserer Schnitt als A14, deshalb entfernt
# statt stillschweigend wirkungslos gelassen. Block A14 (20.08.).

dungeons:
  # Folgt zwingend aus world.features: Dungeons hängen an Locations — ohne
  # gebuchte Krypta gibt es keinen Eingang in der WELT.
  #
  # Der zweite Grund ist seit dem 27.08.2026 hinfällig: Hier stand, die
  # Raumteile seien "durchweg Fremdexporte" und eine betretbare Instanz
  # wäre "ein leerer Raum aus unsichtbaren Wänden". Das Kit DG_Steingrab
  # hat acht eigene Bauteile mit Modellen, Türen, Licht und setzbarer
  # Deko, und es ist betreten worden.
  #
  # Was dieser Schalter NICHT verhindert: `dungeon create` und
  # `dungeon enter <id>` springen weiterhin per ID in jede Instanz. Er
  # steuert allein, ob beim Weltbau Eingänge gebucht werden — solange es
  # kein Portal gibt, hat ein gebuchter Eingang keinen Nutzen.
  enabled: false
  # E5/E8: laesst einen Admin im Dungeon-Editor einen Saal BAUEN — der
  # Server schreibt die GLB nach assets/generiert/ und traegt das Modul in
  # modul-registry.json ein. Ohne diesen Schalter lehnt der Server das
  # Paket ab UND der Editor zeigt das Formular gar nicht erst an.
  modulbau: true
  # doors, seeded: verworfen (A14, 20.08.) -- Tueren steuert das jeweilige
  # Kit selbst (RoomDef.doorTypes/doorChance in
  # shared/src/dungeonGenerator.ts), kein globaler Schalter liest "doors".
  # "seeded" traf kein Konzept: Dungeon-Generierung ist immer seed-basiert,
  # einen ungeseedeten Modus gibt es nicht.

# events: chance und interval wurden nie aus dieser Datei gelesen -- die
# echten Werte sind fixe Konstanten in shared/src/constants.ts
# (EVENT_CHANCE = 0.2, EVENT_INTERVAL_MS = 46 Minuten, dieselben Zahlen
# wie hier). activation-radius und require-keys entsprachen von Anfang an
# keinem implementierten Konzept -- die Ueberfall-Logik in WovServer.ts
# kennt beides nicht. Aus demselben Grund wie zdos oben entfernt statt
# stillschweigend wirkungslos gelassen. Block A14 (20.08.).

# ── Wetter und Nebel ───────────────────────────────────────────────────
# Ohne diesen Abschnitt bleibt alles wie bisher: Das Wetter ist eine reine
# Funktion der Weltzeit (shared/src/weather.ts), alle 666 s zieht ein
# gesetzter Zufallsgenerator aus dem Topf des Bioms. Fuer Wiesen sind das
# 86 % Clear und je 3,4 % Rain, Misty, ThunderStorm, LightRain.
#
# Beide Werte gehen beim Anmelden als Paket WeltWetter an jeden Client,
# damit ALLE Spieler dieselbe Stimmung sehen. Der Server selbst rechnet
# nicht damit -- Wetter und Licht sind Clientsache.
wetter:
  # Name einer Umgebung aus shared/src/envData.json (Clear, Misty, Rain,
  # ThunderStorm, LightRain, Snow, SwampRain, ...). Leer = wuerfeln wie
  # bisher. Ein unbekannter Name wird beim Start gemeldet und ignoriert.
  umgebung: Klar-Comic
  # Feste Nebeldichte. Leer oder fehlend = der Tageszeit folgen — und das
  # ist bei Klar-Comic die richtige Wahl: Dieses Wetter bringt seine vier
  # Dichten fuer die exp-Kurve selbst mit (0,0009 bis 0,0025), eine feste
  # Zahl aus der EXP2-Zeit waere hier eine Wand.
  #
  # WARUM HIER EINE ZAHL STEHT UND NICHT NUR Misty: Die Dichte einer
  # Umgebung schwankt ueber den Tag erheblich -- Misty steht mittags auf
  # 0,020 und nachts auf 0,150, dem Achtfachen. 0.0171 ist der Wert, den
  # Misty um 13.6 h liefert; festgenagelt bleibt diese Sicht rund um die
  # Uhr. Die Nebel-FARBE folgt weiter der Tageszeit, nachts wird es also
  # dunkler, aber nicht dichter.
  nebeldichte:

# ── Look ───────────────────────────────────────────────────────────────
# Tonemapping, Nachbearbeitung, Himmel und Schatten. Der Block ist
# OPTIONAL: Fehlt er ganz, gilt LOOK_VORGABE aus shared/src/lookProfil.ts
# — dieselben Zahlen, die unten stehen. Er steht hier trotzdem
# ausgeschrieben, weil er sonst unauffindbar waere.
#
# ACHTUNG, ZWEI DINGE:
#
#  1. Ein UNBEKANNTER Schluessel in diesem Block BEENDET DEN START mit
#     einer Meldung. Das weicht bewusst von `wetter:` ab, wo ein
#     Tippfehler nur eine Warnung ergibt: Ein falscher Umgebungsname ist
#     sichtbar (die Welt wuerfelt weiter), ein falscher Look-Schluessel
#     ist es NICHT — er sieht aus wie ein gesetzter Regler und kommt nie
#     an. Genau diese stille Wirkungslosigkeit hat A14 aus dieser Datei
#     geraeumt; ein Block mit dreissig Reglern darf sie nicht
#     zurueckbringen.
#  2. Die Werte erreichen einen Client NUR BEIM ANMELDEN (Paket
#     WeltWetter, wie `wetter:`). Wer hier dreht, waehrend jemand spielt,
#     aendert bei ihm nichts — er muss neu verbinden.
look:
  # ── Tonemapping: KEINS ───────────────────────────────────────────────
  # `aus`, und das ist eine Messung aus den Spieldateien, keine Meinung:
  # Level1 setzt `Tonemapping.mode = 0 = None`, und ALLE NEUN Spiel-Level
  # tun dasselbe (design/original-boden.md §E). Nur Menue, Charakterwahl
  # und Village1 fahren `Neutral`.
  #
  # Der Widerspruch zu der Messreihe, die hier bis gestern `neutral`
  # begruendet hat, ist echt und aufgeloest: Jene Reihe zielte auf
  # `village-square-staging.png` — ein Bild aus dem SCHWESTERPROJEKT.
  # Das Zielbild ist seit dem 10.09.2026 Tale of Dark Lands, und das hat
  # keine Kurve. Die Tabelle bei LOOK_VORGABE bleibt trotzdem stehen; sie
  # ist richtig fuer die Frage, die sie beantwortet hat.
  #
  # Was `aus` mit sich bringt, ist der Grund, aus dem diese Runde
  # ueberhaupt kalibrierbar ist: OHNE Kurve ist ein sRGB-Luma-VERHAELTNIS
  # unabhaengig von der Belichtung — beide Seiten laufen durch dieselbe
  # Potenz 1/2,2, der Faktor kuerzt sich. Genau drei Verhaeltnisse sind
  # der Abnahmemassstab (`design/look-referenz.md`: Hangfels/Himmel 0,73,
  # Kronen/Himmel 0,34, Moos/Himmel 0,435); mit einem Tonemapper haette
  # jede Belichtungskorrektur sie wieder verschoben.
  tonemapping: aus
  # Am Bild kalibriert und NICHT uebertragen: Die `postExposure 0,7` des
  # Vorbilds steht in einer Komponente, die AUS ist (ColorAdjustments,
  # §E), und Unitys Blende ist ohnehin keine Babylon-Belichtung. Diese
  # Zahl stellt die absolute Helligkeit auf die Regionswerte der
  # Referenzbilder ein; die Verhaeltnisse beruehrt sie nicht (s. oben).
  belichtung: 1.42
  # ── Kontrast 0,84: der EINZIGE gegenlaeufige Regler ──────────────────
  # Hier stand 1,0 mit der Begruendung, das Vorbild fuehre keinen
  # Kontrastregler. Das bleibt richtig als Herkunftsaussage und ist als
  # Zielaussage falsch: Gesucht war „Boden hoch, Himmel leicht runter",
  # und von den fuenf Reglern, die am 12.09.2026 einzeln gegen denselben
  # Bildinhalt gefahren wurden, hat GENAU EINER entgegengesetztes
  # Vorzeichen auf Boden und Himmel (Pose `weitblick`, 12:00, je auf dem
  # Stand darueber):
  #
  #   belichtung 1,42 → 2,0     Boden  +7,4   Himmel  +24,4   beide hoch
  #   tonemapping neutral       Boden  −4,3   Himmel   −8,8   beide runter
  #   grading Dorf              Boden  −4,4   Himmel   −1,5   beide runter
  #   kontrast 1,0 → 0,84       Boden +12,5   Himmel   −3,9   GEGENLAEUFIG
  #   saettigung 1,0 → 1,12     Boden   ±0    Himmel    ±0    nur Farbe
  #
  # Babylon mischt unter 1,0 im Gammaraum gegen Mittelgrau
  # (`mix(vec3(0.5), rgb, contrast)`, NACH dem Tonemapping) — das hebt
  # alles Dunkle und senkt alles Helle.
  #
  # Der Preis steht dabei und ist gemessen, nicht geschaetzt: Bei ?t=0
  # hebt 0,84 den Boden von L 21,2 auf 34,0 und das Bild-p5 von 19,1 auf
  # 32,4. Die Nacht wird flauer, nicht bunter (S 0,452 → 0,184).
  # Innenraeume sind nicht gemessen — dort steht die naechste Karte.
  kontrast: 0.84
  # Das Vorbild hat KEINEN Saettigungsregler: In keiner der zwoelf
  # Szenen des Spiels ist `saturation` ueberschrieben (§E, F2). Die 0,45
  # war eine Erfindung des Labors — sie hat eine Farbe weggenommen, die
  # danach mit Toenungen wieder hereingerechnet wurde.
  #
  # Die 1,12 ist deshalb keine Rueckkehr zu jener Erfindung, sondern der
  # Ausgleich fuer `kontrast 0,84`: Die Mischung gegen Mittelgrau nimmt
  # mit dem Kontrast auch Farbe. Gemessen am Wiesengrund (`weitblick`,
  # 12:00) hebt 1,12 die Saettigung von 0,399 auf 0,439 — das Zielband
  # der Referenz ist 0,42–0,47 (gemessen 0,447), und der Regler ruehrt
  # die Helligkeit dabei nicht an (Boden ±0, Himmel ±0).
  saettigung: 1.12
  # ── Nebel: linear 15 → 200 m ─────────────────────────────────────────
  # `m_FogMode = 1` (Linear), `m_LinearFogStart` 15, `m_LinearFogEnd` 200
  # (§D). Im Linear-Modus liest niemand `fogDensity` — auch das Vorbild
  # nicht, dessen `m_FogDensity` 0,01 daneben steht und nichts tut.
  #
  # Das ist ERHEBLICH dichter als die exp-Kurve mit 0,0009, die hier
  # stand: Bei 200 m war unser Bild zu 16 % Nebel, das Vorbild ist es zu
  # 100 %. F6 nennt das die wahrscheinlichste Ursache dafuer, dass unsere
  # Ferne anders wirkt.
  #
  # ── Nebelende 200 → 800 m (Entscheidung E3, 12.09.2026) ─────────────
  # Die FARBE bleibt, die Reichweite nicht. Drei Zeugen, alle an
  # `weitblick`/`steinkreis` 12:00 gemessen, Farbe unveraendert:
  #
  #   nebelEnde            200    600    700    800   1000   1400
  #   Ferne B−R           26,1    5,5    3,7    2,1     —      —
  #   Ferne/Himmel       0,628  0,559  0,554  0,550     —      —
  #   Ferne p95−p5        68,4   81,1   82,1   83,0   84,1   85,5
  #
  # 1. Bei 800 m FAERBT der Nebel die Ferne nicht mehr blau (B−R 2,1
  #    statt 26,1), er verschleiert sie nur noch.
  # 2. Die Struktur in der Ferne waechst bis 800 m um 14,6 Luma, danach
  #    um rund 1 Luma je 100 m — ab hier kauft mehr Sicht nichts mehr.
  # 3. Ferne/Himmel landet auf 0,550; gemessen sind 0,53.
  #
  # Was 800 m NICHT leistet, damit es niemand annimmt: Die Fernschale
  # des Gelaendes reicht an dieser Pose bis 1091 m, der Wasserring bis
  # 1498 m. Alles dahinter steht weiter in voller Nebelfarbe; „keine
  # Flaeche erreicht die volle Nebelfarbe" braeuchte 1500 m und ist eine
  # eigene Entscheidung.
  nebelmodus: linear
  nebelStart: 15
  nebelEnde: 800
  nebelWaerme: 0
  # ── Grading: die ganze Farbhandschrift des Vorbilds ──────────────────
  # `ShadowsMidtonesHighlights` ist die EINZIGE Komponente, die in Level1
  # Farbe verschiebt (§E). Die Zahlen stehen so, wie Unity sie ablegt:
  # Farben in Gamma, Offset im vierten Kanal. Umgerechnet wird im Client
  # (client/src/engine/Grading.ts), und dort steht auch der Befund, den
  # man beim Abschreiben verpasst: `lichterStart` 1,07 liegt UEBER der
  # hoechsten Luminanz, die der LDR-Farbraum des Vorbilds erreichen kann
  # — die Lichter-Zeile feuert nie. Sie steht hier trotzdem, damit die
  # Rechnung vollstaendig bleibt.
  #
  # ── Die Schattenzeile stand auf der EINS (12.09.2026) ───────────────
  # `Grading.ts` hat `schatten*` immer schon mitgerechnet; im Profil
  # stand `#ffffff` mit Offset 0, also die Identitaet. Was hier jetzt
  # steht, ist die Dorf-Zeile der Entscheidung E1, aus den ROHEN
  # Komponentenwerten (0,9800831 / 0,92229587 / 1,0) mit dem Offset
  # −0,044477392 in Hex gerundet. Zwei Dinge dazu, beide gemessen:
  #
  #  · Der Offset ist NEGATIV, und das ist kein Vorzeichenfehler: Ein
  #    positiver Offset wirkt in dieser Zeile VIERFACH. `client/test/
  #    grading-schatten.ts` rechnet die Aufbereitung nach.
  #  · Die 8-Bit-Rundung des Hex kostet hoechstens 0,0038 (schlechtester
  #    Wert: das Blau der Mittenzeile, roh 0,9038545 → Byte 230). Im Bild
  #    sind das rund 0,3 sRGB-Byte auf dem Himmel.
  #
  # REIHENFOLGE-BEDINGUNG: `schattenEnde` (0,3) muss unter
  # `lichterStart` (0,55) bleiben. Ueberlappen die Baender, wird das
  # Mittengewicht `1 − fS − fH` NEGATIV und die Tabelle kehrt Farben um
  # — ohne Symptom, denn `pruefeLook` kennt nur Bereiche, keine
  # Reihenfolge. `setzeGrading` warnt seither auf der Konsole.
  #
  # Die Lichterzeile steht jetzt auf Weiss mit Offset 0 und feuert ab
  # 0,55 — das ist NICHT wirkungslos: Sie verdraengt oberhalb der
  # Schwelle das Mittengewicht und haelt Weiss neutral, wo die Wildnis
  # es bis ins letzte Byte waermte (255/245/239). Gemessen aendert das
  # 11.296 von 131.072 LUT-Bytes, und zwar ausschliesslich ZUR
  # unveraenderten Farbe hin.
  grading:
    an: true
    schatten: '#faebff'
    schattenOffset: -0.044477392
    schattenStart: 0
    schattenEnde: 0.3
    mitten: '#fff5e6'
    mittenOffset: -0.014825796
    lichter: '#ffffff'
    lichterOffset: 0
    lichterStart: 0.55
    lichterEnde: 1.0
  # Schwelle 0,35 statt 0,85, Staerke 0,55 statt 0,22 — beide direkt aus
  # dem Profil `FantasyL1` (§E). Das Vorbild blueht viel frueher und
  # staerker; unsere Schwelle liess praktisch nichts durch. Die
  # Dirt-Textur (dirtIntensity 12,0) haben wir nicht, das ist ein eigener
  # Effekt und keine Zahl (F15).
  bloom:
    an: true
    schwelle: 0.35
    staerke: 0.55
    skala: 0.5
    kernel: 32
  # UMGERECHNET, nicht kopiert: URPs `intensity 0,25` und Babylons
  # `vignetteWeight` sind verschiedene Skalen. Verglichen wurde die
  # ABDUNKLUNG IN DER BILDECKE bei 16:9 (F16):
  #
  #   URP      dist = 0,5 · (0,25 · 3) = 0,375 je Achse, Rundheit 1,
  #            Glaettung 1/(0,2 · 5) = 1  →  (1 − 2 · 0,375²)^1 = 0,719
  #   Babylon  vignetteTerm = 1,271 bei FOV 0,5 rad,
  #            vignette = 1,271^(−2·w)  →  w = ln(0,719) / (−2 · ln 1,271)
  #                                          = 0,686
  #
  # 1,2 dunkelte die Ecke auf 0,56 ab, also fast doppelt so stark wie das
  # Vorbild. Die Referenzrechtecke liegen alle in der Bildmitte — diese
  # Zahl ist deshalb gerechnet und nicht gemessen, und das steht hier.
  vignette:
    an: true
    staerke: 0.686
    farbe: '#0d0a08'
  # Unity-intensity 0,10 (§E) auf Babylons Pixelverschiebung: 0,10 × 30
  # = 3,0 — dieselbe Umrechnung, mit der hier 4,5 stand (die galt fuer
  # die 0,15 des Schwesterprojekts).
  ca:
    an: true
    staerke: 3.0
  # ── Tiefenunschaerfe: jetzt mit Zahlen ───────────────────────────────
  # Bisher war das ein Schalter. Das Vorbild fuehrt Bokeh mit
  # focusDistance 2,0 m, aperture 6,0, focalLength 47 mm (§E; die
  # gaussianStart/End 70/100 gelten nur im Gauss-Modus und sind hier
  # wirkungslos). Wie daraus ein Unschaerferadius wird, steht in
  # client/src/engine/ValheimDof.ts — kurz: URP rechnet
  # maxCoC = (f/N) · (f/1000) / (P − f/1000) = 0,1885, und das mal 14
  # Bildpunkten ergibt rund 2,6 px. Eine milde, aber ueber die ganze
  # Ferne gleichmaessige Weichzeichnung, die schon ab etwa 10 m voll
  # anliegt — deutlich frueher als unser bisheriger Autofokus (scharf bis
  # 70 m).
  dof:
    an: true
    fokus: 2.0
    blende: 6.0
    brennweite: 47
  strahlen:
    an: true
    ankerAbstand: 1400
    torWinkel: 55
    hysterese: 5
    exposure: 0.18
    decay: 0.965
    gewicht: 0.5
    dichte: 0.94
  # ── Himmel: vom Nebel ABGEKOPPELT ────────────────────────────────────
  # Hier stand `horizont: nebel`, und das war richtig, solange Himmel und
  # Dunst dieselbe Farbe haben sollten. Im Vorbild haben sie es nicht:
  # Der Himmel ist die Cubemap `Sky1 L1` (Tint #B2D1FE, Exposure 0,8),
  # der Nebel eine eigene Farbe #73A7FF (§D). Die Referenz misst beide
  # getrennt und deutlich verschieden — Himmel S 0,133 (heller Dunst)
  # gegen Nebel S 0,549 (sattes Blau). Mit gekoppeltem Horizont waere die
  # eine Zahl nur um den Preis der anderen zu treffen.
  #
  # ── A5 / Tor T2 (11.09.): der Verlauf ist keine Erfindung mehr ──────
  # Hier stand: „Die Cubemap haben wir nicht. Was die Referenz hergibt,
  # ist GENAU EINE Himmelsfarbe (Bild 3, Rechteck 1220,20–1290,70, RGB
  # 129/145,4/148,6 = #819195 bei Luma 142,1) — ein Verlauf waere eine
  # Erfindung, aus einem einzigen Messwert folgen keine zwei
  # Stuetzpunkte." Das war richtig, solange die Karte nur behauptet war.
  #
  # Sie liegt lokal vor (`AllSky_FantasyClouds_High3`, sechs Flaechen zu
  # 2048²) und liefert die zweite Stuetze. Mit dem Tint #B2D1FE und
  # Exposure 0,8 des Vorbilds gemessen:
  #
  #   Elevation +42°:  L 113  S 0,58        Elevation +5°:  L 168  S 0,33
  #
  # Also Zenit dunkler und deutlich blauer, Horizont heller und fast
  # weiss. Dieselbe RICHTUNG misst Bild 3 auf dem Bildschirm, nur
  # flacher (L 137,7 oben gegen L 154,6 weiter unten) — die Vorlage
  # drueckt ihren eigenen Verlauf mit ihrer Nachbearbeitung zusammen,
  # und das tut unsere auch.
  #
  # Die zwei Farben unten sind deshalb gemessen und nicht gegriffen:
  # Ihr Mittel ueber die Himmelsflaeche der Pose `weitblick` haelt die
  # kalibrierte Luma 142, ihre Spreizung ist die des Vorbilds, und die
  # Saettigung des Zenits holt die 0,13 der Referenz, die eine
  # gleichmaessige Kuppel bei 0,081 liegen liess. Nachgemessen mit
  # `~/wov-lab-mess/himmel-mess.mjs`; `?sky=flach` faehrt zum Vergleich
  # den Stand davor.
  #
  # Die NAHT am Meereshorizont, die hier als offene Frage (F36) stand,
  # schliesst A6: Die Kuppel wird in ihrem untersten Band (2,0°) selbst
  # zur Nebelfarbe. Der Regler dafuer sitzt in `ValheimSky.ts` — er ist
  # keine Look-Entscheidung, sondern die Bedingung dafuer, dass diese
  # beiden Farben ueberhaupt frei waehlbar sind.
  #
  # Die Wolken- und Halo-Felder aus A5/A12 (wolken, wolkenHelligkeit,
  # wolkenSchatten, wolkenParallaxe, silberrand, haloBreite, haloStaerke)
  # sind seit 11.09.2026 eingehaengt (`shared/src/lookHimmel.ts` in
  # `lookProfil.ts`); fehlen sie hier, gelten die kalibrierten Vorgaben.
  himmel:
    zenit: '#6B8798'
    horizont: '#8D9598'
    sonnenglühen: 0.2
  # ── Schatten: 50 m, ZWEI Kaskaden ────────────────────────────────────
  # Die Reichweite 50 m stammt aus dem URP-Asset der Stufe „Balanced"
  # (HDR an, MSAA 1, LUT 32) — nicht aus Unitys `QualitySettings`, die
  # URP gar nicht liest (§D). `kaskaden` ersetzt, wie `reichweite`, die
  # Zahl der Qualitaetsstufe.
  #
  # ── 1 → 2 (12.09.2026): die 1 war nie eine Einstellung ──────────────
  # Hier stand `kaskaden: 1` mit dem Zusatz „Eine Kaskade statt zwei ist
  # zugleich eine ganze Renderpassage weniger ueber die Werferliste".
  # Das war falsch, und zwar folgenlos-falsch: Babylons
  # `CascadedShadowGenerator` klemmt `numCascades` im SETTER auf
  # `MIN_CASCADES_COUNT = 2`. Es liefen immer zwei Passagen; nur die
  # Debugzeile meldete „1x", und mit ihr `__vb.profil().schattenKaskaden`
  # und die Kostenrechnung „Werfer x Kaskaden". Seit `schattenMitLook()`
  # den Deckel selbst einzieht (`MIN_KASKADEN`), waere die 1 nur noch
  # eine falsche Zahl im Profil. Am Bild aendert die 2 nichts.
  #
  # ── A7 (11.09.): `dunkelheit` 0,42 → 0,62, am VERHAELTNIS gemessen ───
  # Babylons `darkness` ist das RESTLICHT im Schatten, nicht seine
  # Staerke — die Unity-Zahl des Vorbilds (Schattenstaerke 1,0) waere
  # hier eine 0,0 und damit ein schwarzer Schatten. Uebertragen wird
  # deshalb nicht die Zahl, sondern das, was man im Bild misst:
  # Bild 2 der Referenz hat Licht/Schatten am Fels = 1,21 (47,8 zu 39,3).
  #
  # Zeuge: `~/wov-lab-mess/himmel-mess.mjs`, Pose `felsschatten`
  # (10111/−18649, der freie 46°-Hang). Die Schattenmaske entsteht durch
  # ABSCHALTEN — einmal mit, einmal mit `darkness = 1`, die Differenz IST
  # der Schatten —, gemessen wird auf den Gesteinsschichten rock-rough
  # und rock-a. Drei Punkte:
  #
  #     darkness 0,25 → 1,375     0,42 → 1,313     0,62 → 1,236
  #
  # 0,62 lag im Fenster 1,21 ± 0,05. Der Regler wirkt also, und er wirkt
  # in der erwarteten Richtung.
  #
  # ── 0,62 → 0,20 (12.09.2026) ────────────────────────────────────────
  # Die 0,62 stammt aus einem Bild, in dem der Schatten kaum zu finden
  # war, und sie hat das Fenster nur getroffen, indem sie den Schatten
  # weiter aufhellte. Mikes Befund („Schatten nicht klar sichtbar")
  # bleibt damit stehen. 0,20 geht den entgegengesetzten Weg: Das
  # Restlicht im Schatten wird klein genug, dass ein Schlagschatten als
  # Form lesbar ist, und der aufgehellte Gesamteindruck, der die 0,62
  # noetig machte, kommt jetzt aus `kontrast 0,84` (oben) statt aus dem
  # Schattenrestlicht. Die Zahl ist eine Entscheidung dieses Workflows
  # und wird in der Gesamtmessung als Licht/Schatten-Verhaeltnis
  # mitgefuehrt.
  #
  # `ambColorDay` ist dabei NICHT mitbewegt worden, und das ist gemessen
  # und nicht vergessen: Der Schritt von 0,42 auf 0,62 hebt am
  # Verhaeltniszeugen `weitblick` den Moosgrund von L 59,8 auf 59,5 und
  # den Himmel von 142,8 auf 143,0 — also unter einem Prozent, und
  # Moos/Himmel bleibt bei 0,416. Es gab nichts auszugleichen; ein Griff
  # an das Grundlicht waere eine Aenderung ohne Befund gewesen.
  #
  # Was damit NICHT erreicht ist: Das Vorbild kommt auf sein flaches
  # Verhaeltnis ueber einen SCHWARZEN Schatten und ein sehr starkes
  # Cubemap-Grundlicht (D/A ≈ 0,5 linear), wir ueber ein aufgehelltes
  # Schattenrestlicht (D/A ≈ 3,3). Dieselbe Zahl, anderer Weg. Der Weg
  # des Vorbilds hiesse, das Grundlicht auf das Sechsfache zu heben und
  # die Bodenkalibrierung der Stufe 2 neu zu fahren — ein eigener Block.
  schatten:
    aufloesung: 1024
    reichweite: 50
    kaskaden: 2
    dunkelheit: 0.20
    rasten: true
