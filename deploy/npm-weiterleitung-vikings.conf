# World of Vikings — Vorlage: world-of-vikings.com wird abgeloest (Karte D1)
#
# STAND: Teil 1 (Apex + www) ist seit dem 28.09.2026 im Nginx Proxy Manager
# (CT 100, Proxy-Host 3) eingetragen. Diese Datei haelt die dort stehende
# Form fest, damit sie nicht verloren geht und nicht wieder in eine Form
# zurueckgebaut wird, die mit dem Proxy Manager kollidiert. Teil 2
# (Subdomains) ist NOCH NICHT ausgefuehrt und gilt erst mit dem naechsten
# Live-Stand (Mikes Entscheid vom 28.09.2026).
#
# Regel (ZIELAENDERUNG, Karte D1):
#   /de, /de/…, /de?…  -> https://world-of-mmorpg.de<Pfad und Query>
#   alles andere       -> https://world-of-mmorpg.com<Pfad und Query>
#   (/de… ohne Trenner, z. B. /deutsch, gehoert NICHT zu /de und geht nach .com)
# Dieselbe Regel steht als Funktion in
# wov-web/src/lib/basisDomains.ts (weiterleitungsZielVikings, mit Test in
# basisDomains.test.ts) — nginx kann diese Funktion nicht aufrufen, muss
# aber dieselbe Vorschrift abbilden. Die drei Zeilen unten und diese
# Funktion daher immer zusammen aendern; tools/test/
# npm-weiterleitung-vikings-vorlage.ts haelt beide gegeneinander.
#
# ---------------------------------------------------------------------
# 1) world-of-vikings.com und www.world-of-vikings.com (Apex + www)
#    Proxy-Host 3, Feld "Custom Nginx Configuration" — die Zeilen gelten
#    auf SERVER-Ebene, nicht in `location`-Bloecken.
#
#    Warum Server-Ebene: Der Proxy Manager erzeugt fuer den Host selbst
#    ein `location /` (proxy_pass auf das Ziel). Eigene `location /`-Bloecke
#    aus dem Feld kollidieren damit (doppelte Location, nginx -t schlaegt
#    fehl). `set`, `if` und `return` auf Server-Ebene laufen dagegen in der
#    Rewrite-Phase, VOR der Auswahl der location — das `return` greift, bevor
#    das proxy_pass des Proxy Managers je zum Zug kommt ("Forward Hostname"
#    ist damit gleichgueltig).
#
#    Warum die ACME-Ausnahme: Das Zertifikat wird per HTTP-01 erneuert; die
#    Pruefung ruft http://<Name>/.well-known/acme-challenge/… ab und folgt
#    keiner Weiterleitung auf eine andere Domain. Ohne Ausnahme schluege jede
#    Erneuerung fehl, sobald die Weiterleitung steht.
#
#    Rueckweg: das Feld "Custom Nginx Configuration" leeren und speichern —
#    danach gilt wieder der Proxy-Host wie zuvor (Ziel http://10.10.10.12:80,
#    das ist wov-dev/CT 102, NICHT CT 103, s. Angriffsbefund M3).
# ---------------------------------------------------------------------
#
# server_name world-of-vikings.com www.world-of-vikings.com;
#
# set $d1_ziel world-of-mmorpg.com;
# if ($request_uri ~ "^/de(/|\?|$)") { set $d1_ziel world-of-mmorpg.de; }
# if ($request_uri !~ "^/\.well-known/acme-challenge/") { return 301 https://$d1_ziel$request_uri; }
#
# ---------------------------------------------------------------------
# 2) Produktive Subdomains: play./editor./api./assets./live.
#    GILT ERST MIT DEM NAECHSTEN LIVE-STAND (Mikes Entscheid vom
#    28.09.2026) — bis dahin bleiben die Subdomains unveraendert. Nichts
#    davon wird vorab eingetragen.
#
#    Je Subdomain EIGENER NPM-Proxy-Host (eigenes Zertifikat), reine
#    Host-Weiterleitung auf die gleichnamige Subdomain von
#    world-of-mmorpg.com — Pfad und Query bleiben unveraendert, "innerhalb
#    einer Domain bleiben" gilt erst NACH der Anmeldung auf der neuen
#    Domain, nicht fuer den alten Namen selbst. Gleiche Form wie oben
#    (Server-Ebene, ACME-Ausnahme), ohne die .de-Wahl.
#
#    Je Subdomain <name> (play, editor, api, assets, live):
# ---------------------------------------------------------------------
#
# server_name <name>.world-of-vikings.com;
#
# if ($request_uri !~ "^/\.well-known/acme-challenge/") { return 301 https://<name>.world-of-mmorpg.com$request_uri; }
#
# ---------------------------------------------------------------------
# 3) NICHT umgestellt: *.dev.world-of-vikings.com, *.staging.world-of-vikings.com
#    Bleiben laut ZIELAENDERUNG vorerst ohne Weiterleitung in Betrieb — die
#    neuen Namen kommen nur ZUSAETZLICH dazu, nichts an den dev/staging-
#    Namen aendert sich in Teil 3.
# ---------------------------------------------------------------------
