name: CI

on:
  push:
  pull_request:
  # merge_group ist noch nicht in Gebrauch (keine Merge Queue bei diesem
  # Volumen), steht aber schon hier, damit die Umstellung spaeter nur eine
  # Einstellung im Ruleset ist und kein zweiter CI-Umbau.
  merge_group:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # Kein GPU/Browser im Runner: der Testlauf braucht keinen -- alle
      # Client-Tests der KERNLISTE laufen ueber Babylons NullEngine
      # (Software, kein WebGL) oder sind DOM-frei (s. Kopfkommentare in
      # scripts/run-tests.mjs). Playwright-gestuetzte Messungen (tools/pw-*)
      # sind bewusst NICHT hier drin -- die laufen laut Projektnotiz nur
      # lokal gegen den :5274-Tunnel, auf einem reinen Server-Container
      # startet dort kein Chromium.
      #
      # WOV_OHNE_MODELLE=1: assets/ liegt bewusst nicht in diesem Repo
      # (siehe .gitignore) und der Runner holt hier kein Asset-Paket -- die
      # Weiche taeuscht das Fehlen der Modelle absichtlich vor, statt es
      # zufaellig vorzufinden (scripts/testweichen.mjs, scripts/run-tests.mjs).
      - run: npm test
        env:
          WOV_OHNE_MODELLE: "1"

      # Das Bauen war bisher nicht Teil der Pruefung, obwohl es der Schritt
      # ist, den DEV und LIVE spaeter fahren. Der Client-Build allein braucht
      # hier rund 20 Sekunden -- billig genug, um Fehler zu finden, die
      # typecheck und Tests nicht sehen (fehlende Importe im Bundle,
      # Rollup-Aufloesung, tsc des shared-Pakets).
      - run: npm run build

  # Die Webseite (wov-web) ist ein eigenes npm-Projekt ausserhalb der
  # Wurzel-Workspaces und wurde bisher erst beim Ausrollen geprueft
  # (tools/wov-update.sh). Eigener Job, damit beide parallel laufen und ein
  # Fehler hier den Client-Build nicht verdeckt.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wov-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            wov-web/package-lock.json

      # Die Webseite importiert @wov/shared (Suche, Forum-Client). Der Link
      # dorthin liegt in node_modules der Wurzel; ohne diesen Schritt findet
      # weder svelte-check noch der Build das Paket (so laeuft es auch in
      # tools/wov-update.sh, das die Wurzel vor wov-web installiert).
      - run: npm ci
        working-directory: .

      - run: npm ci

      - run: npm run check

      - run: npm run lint

      - run: npm run build

      - run: npm run ohne-js

      - run: npm test
